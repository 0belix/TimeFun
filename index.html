<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Packlistan</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16323A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Packlistan">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Space+Grotesk:wght@500;700&family=Playfair+Display:wght@600;700&family=Libre+Baskerville:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --petrol: #16323A;
    --petrol-2: #1E4048;
    --petrol-3: #244B54;
    --sand: #F1E9D8;
    --sand-dim: #C9C2AD;
    --brass: #C89B3C;
    --brass-dim: #8F7130;
    --coral: #E4633F;
    --muted: #7FA39C;
    --danger: #D4483F;
    --radius: 10px;
    --font-display: 'Big Shoulders Display', sans-serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--petrol);
    color: var(--sand);
    font-family: var(--font-body);
    -webkit-tap-highlight-color: transparent;
  }
  button, input{ font-family: inherit; color: inherit; }
  :focus-visible{ outline: 2px solid var(--brass); outline-offset: 2px; }
  h1,h2,h3{ font-family: var(--font-display); margin:0; text-transform: uppercase; letter-spacing: .04em; }

  #app{ max-width: 640px; margin: 0 auto; padding: 18px 16px 60px; min-height: 100dvh; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 22px;
  }
  .topbar h1{ font-size: clamp(26px,7vw,34px); color: var(--sand); }
  .topbar .plane{ font-size: 22px; }

  .screen{ display:none; animation: fadeIn .3s ease both; }
  .screen.active{ display:block; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  /* ---------- Buttons ---------- */
  .btn{
    font-family: var(--font-display);
    font-size: 15px;
    letter-spacing: .04em;
    text-transform: uppercase;
    background: var(--brass);
    color: var(--petrol);
    border: none;
    padding: 13px 18px;
    border-radius: var(--radius);
    cursor: pointer;
    font-weight: 700;
  }
  .btn:active{ transform: translateY(1px); }
  .btn.secondary{
    background: transparent;
    color: var(--sand);
    border: 2px solid var(--petrol-3);
  }
  .btn.danger{ background: var(--danger); color: var(--sand); }
  .btn.block{ width:100%; }
  .btn:disabled{ opacity:.4; cursor:default; }
  .icon-btn{
    background: var(--petrol-2);
    border: 1px solid var(--petrol-3);
    color: var(--sand);
    width: 38px; height: 38px;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:16px;
  }
  .icon-btn:active{ transform: scale(.93); }

  /* ---------- Home: trip cards ---------- */
  .trip-list{ display:flex; flex-direction:column; gap: 14px; }
  .trip-card{
    background: var(--petrol-2);
    border: 1px solid var(--petrol-3);
    border-radius: var(--radius);
    padding: 16px 16px 14px;
    display:flex; align-items:center; gap: 14px;
    cursor:pointer;
    position: relative;
    border-left: 5px solid var(--brass);
    text-align: left;
    width: 100%;
  }
  .trip-card:active{ transform: scale(.99); }
  .trip-card-main{ flex:1; min-width:0; }
  .trip-dest{ font-size: 24px; color: var(--sand); line-height:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .trip-meta{ font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-top: 6px; }
  .trip-owner{ font-size: 12px; color: var(--brass); margin-top: 4px; }
  .trip-tags{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .trip-tag{ font-size: 15px; }

  .progress-badge{
    width:54px; height:54px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .progress-badge .ring{ width:100%; height:100%; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .progress-badge span{
    width:42px; height:42px; border-radius:50%; background:var(--petrol-2);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-mono); font-size: 11px; color: var(--sand);
  }

  .new-trip-card{
    border: 2px dashed var(--petrol-3);
    border-radius: var(--radius);
    padding: 18px;
    text-align:center;
    color: var(--muted);
    font-family: var(--font-display);
    font-size: 17px;
    letter-spacing: .04em;
    text-transform: uppercase;
    cursor:pointer;
    background:none;
    width:100%;
  }
  .new-trip-card:active{ transform: scale(.99); }

  .empty-state{
    text-align:center; color: var(--muted); padding: 40px 10px;
    font-size: 14px; line-height:1.7;
  }
  .empty-state .big{ font-size: 40px; display:block; margin-bottom:10px; }

  /* ---------- Form ---------- */
  .field{ margin-bottom: 18px; }
  .field label{
    display:block; font-family: var(--font-mono); font-size: 11px;
    color: var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px;
  }
  .section-label{
    display:block; font-family: var(--font-mono); font-size: 11px;
    color: var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px;
  }
  .field input{
    width:100%; background: var(--petrol-2); border: 2px solid var(--petrol-3);
    border-radius: var(--radius); padding: 12px 14px; font-size:16px; color: var(--sand);
  }
  .field input:focus{ border-color: var(--brass); }
  .date-row{ display:flex; gap:10px; }
  .date-row .field{ flex:1; }

  .chip-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    background: var(--petrol-2); border: 2px solid var(--petrol-3); border-radius: 999px;
    padding: 9px 14px; font-size: 14px; cursor:pointer; display:flex; align-items:center; gap:6px;
    color: var(--sand);
  }
  .chip.selected{ border-color: var(--brass); background: rgba(200,155,60,0.18); }
  .chip:active{ transform: scale(.96); }

  .form-actions{ display:flex; gap:10px; margin-top: 24px; }
  .form-actions .btn{ flex:1; }

  /* ---------- Trip detail ---------- */
  .detail-header{
    background: var(--petrol-2); border: 1px solid var(--petrol-3); border-radius: var(--radius);
    padding: 18px; margin-bottom: 4px; position:relative;
  }
  .detail-header-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .detail-dest{ font-size: clamp(24px,7vw,32px); line-height:1.05; }
  .detail-meta{ font-family: var(--font-mono); font-size:12px; color: var(--muted); margin-top:6px; }
  .detail-actions{ display:flex; gap:8px; flex-shrink:0; }

  .progress-bar-track{
    height: 10px; border-radius: 999px; background: var(--petrol-3); overflow:hidden; margin-top:16px;
  }
  .progress-bar-fill{ height:100%; background: var(--brass); border-radius:999px; transition: width .35s ease; }
  .progress-label{ font-family: var(--font-mono); font-size:11px; color: var(--muted); margin-top:6px; text-align:right; }

  .detail-dest-input{
    font-family: var(--font-display); font-size: clamp(22px,7vw,30px); text-transform:uppercase; letter-spacing:.04em;
    background: transparent; border: none; border-bottom: 2px solid var(--petrol-3); color: var(--sand);
    padding: 2px 0; width: 100%; margin-bottom: 8px;
  }
  .detail-dest-input:focus{ border-color: var(--brass); }
  .detail-owner-input{
    font-family: var(--font-body); font-size: 13px; color: var(--brass);
    background: transparent; border: none; border-bottom: 1px solid var(--petrol-3);
    padding: 4px 0; width: 100%; margin-bottom: 10px;
  }
  .detail-owner-input::placeholder{ color: var(--muted); }
  .detail-owner-input:focus{ border-color: var(--brass); }
  .detail-date-row{ display:flex; gap:8px; }
  .detail-date-row input{
    flex:1; background: var(--petrol-3); border:none; border-radius:8px; color: var(--sand);
    font-family: var(--font-mono); font-size:12px; padding: 7px 8px;
  }
  .detail-meta{ font-family: var(--font-mono); font-size:12px; color: var(--muted); margin-top:6px; }

  /* ---------- Planera / Packa ---------- */
  .mode-toggle{ display:flex; gap:8px; margin: 14px 0; }
  .mode-btn{
    flex:1; background: var(--petrol-2); border: 2px solid var(--petrol-3); border-radius: var(--radius);
    padding: 10px; font-family: var(--font-display); font-size:15px; letter-spacing:.03em; text-transform:uppercase;
    color: var(--muted); cursor:pointer;
  }
  .mode-btn.active{ border-color: var(--brass); color: var(--sand); background: rgba(200,155,60,0.15); }

  .daily-hint{
    font-size: 12px; color: var(--muted); background: var(--petrol-2); border: 1px solid var(--petrol-3);
    border-radius: var(--radius); padding: 10px 12px; margin: 0 0 12px; line-height:1.5;
  }

  .daily-chip{
    align-self:flex-start;
    font-size: 11px; font-family: var(--font-mono); color: var(--muted);
    background: transparent; border: 1px solid var(--petrol-3); border-radius: 999px;
    padding: 3px 9px; cursor:pointer; margin-top:2px;
  }
  .daily-chip.active{ color: var(--petrol); background: var(--brass); border-color: var(--brass); font-weight:600; }

  .qty-auto-pill{
    font-family: var(--font-mono); font-size:12px; color: var(--petrol); background: var(--brass);
    border-radius: 999px; padding: 4px 10px; flex-shrink:0; font-weight:600;
  }
  .qty-plain{ font-family: var(--font-mono); font-size:12px; color: var(--muted); flex-shrink:0; }

  /* perforated tear-line: punches "holes" the colour of the page background */
  .tear-line{
    height: 16px;
    background-image: radial-gradient(circle 5px at 10px 8px, var(--petrol) 5px, transparent 6px);
    background-repeat: repeat-x;
    background-size: 20px 16px;
    margin: 0;
  }

  .category{ background: var(--petrol-2); border: 1px solid var(--petrol-3); border-top:none; }
  .category:first-of-type{ border-top: 1px solid var(--petrol-3); border-radius: 0; }
  .category-header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 16px; cursor:pointer;
  }
  .category-header h3{ font-size: 18px; color: var(--sand); }
  .category-count{ font-family: var(--font-mono); font-size:12px; color: var(--muted); }
  .category-chevron{ transition: transform .2s ease; color: var(--brass); font-size:14px; }
  .category.collapsed .category-chevron{ transform: rotate(-90deg); }
  .category-body{ padding: 0 16px 14px; }
  .category.collapsed .category-body{ display:none; }

  .item-row{
    display:flex; align-items:center; gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .item-row:last-child{ border-bottom:none; }
  .item-row.pack-mode{ padding: 12px 0; }

  .item-main{ flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }

  .stamp-check{
    width:36px; height:36px; border-radius:50%; flex-shrink:0;
    border: 2px dashed var(--brass-dim);
    background: transparent;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; position:relative;
  }
  .item-row.pack-mode .stamp-check{ width:42px; height:42px; }
  .stamp-check.packed{
    border-style: solid; border-color: var(--coral);
    background: rgba(228,99,63,0.14);
  }
  .stamp-check.packed::after{
    content:'✓';
    color: var(--coral);
    font-family: var(--font-display); font-size: 18px; font-weight:800;
    transform: rotate(-12deg);
  }
  .stamp-check.stamp-pop{ animation: stampIn .4s cubic-bezier(.2,1.6,.4,1); }
  @keyframes stampIn{
    0%{ transform: scale(1.9) rotate(-25deg); opacity:.3; }
    60%{ transform: scale(.9) rotate(-8deg); opacity:1; }
    100%{ transform: scale(1) rotate(0); }
  }

  .item-name{ font-size:15px; min-width:0; word-break: break-word; }
  .item-row.pack-mode .item-name{ font-size:16px; }
  .item-name.packed{ text-decoration: line-through; color: var(--sand-dim); }
  .item-name-editable{ cursor:text; border-bottom: 1px dashed transparent; }
  .item-name-editable:hover, .item-name-editable:focus{ border-bottom-color: var(--muted); outline:none; }
  .item-name-input{
    font-size:15px; font-family: var(--font-body); color: var(--sand); background: var(--petrol-3);
    border: 1px solid var(--brass); border-radius:6px; padding: 3px 6px; width:100%;
  }

  .qty-stepper{ display:flex; align-items:center; gap:6px; font-family: var(--font-mono); font-size:13px; flex-shrink:0; }
  .qty-stepper button{
    width:24px; height:24px; border-radius:6px; background: var(--petrol-3); border:none; color: var(--sand);
    cursor:pointer; font-size:14px; line-height:1;
  }
  .qty-stepper span{ min-width: 16px; text-align:center; }

  .item-delete{
    background:none; border:none; color: var(--muted); font-size:16px; cursor:pointer;
    padding: 4px 2px; flex-shrink:0;
  }
  .item-delete:hover{ color: var(--danger); }

  .add-item-row{ display:flex; gap:8px; margin-top: 10px; }
  .add-item-row input{
    flex:1; background: var(--petrol-3); border: none; border-radius: 8px;
    padding: 9px 12px; color: var(--sand); font-size:14px;
  }
  .add-item-row input::placeholder{ color: var(--muted); }
  .add-item-row button{
    background: var(--petrol-3); border:none; color: var(--brass); border-radius:8px;
    padding: 0 14px; font-family: var(--font-display); font-size:20px; cursor:pointer;
  }

  .add-category-row{ padding: 16px 0 6px; }

  .toast{
    position: fixed; left:50%; bottom: 24px; transform: translateX(-50%) translateY(0);
    background: var(--sand); color: var(--petrol); font-family: var(--font-mono); font-size:13px;
    padding: 10px 16px; border-radius: 999px; opacity:0; pointer-events:none;
    transition: opacity .25s ease, transform .25s ease;
    z-index: 500; white-space:nowrap;
    display:flex; align-items:center; gap:12px; max-width: calc(100vw - 32px);
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(-6px); pointer-events:auto; }
  .toast-msg{ overflow:hidden; text-overflow:ellipsis; }
  .toast-action{
    background: var(--petrol); color: var(--sand); border:none; border-radius:999px;
    padding: 5px 12px; font-family: var(--font-display); font-size:12px; letter-spacing:.03em;
    cursor:pointer; flex-shrink:0;
  }

  .hidden{ display:none !important; }

  /* ---------- Theme picker ---------- */
  .theme-grid{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }
  .theme-card{
    display:flex; align-items:center; gap:12px;
    background: var(--petrol-2); border: 2px solid var(--petrol-3); border-radius: var(--radius);
    padding: 12px 14px; cursor:pointer; text-align:left; width:100%;
  }
  .theme-card.selected{ border-color: var(--brass); }
  .theme-swatch{ width:44px; height:44px; border-radius:50%; flex-shrink:0; border:2px solid rgba(255,255,255,0.15); }
  .theme-card-text{ flex:1; min-width:0; }
  .theme-card-text .name{ display:block; font-family: var(--font-display); font-size:17px; text-transform:uppercase; letter-spacing:.03em; color: var(--sand); }
  .theme-card-text .desc{ display:block; font-size:12px; color: var(--muted); margin-top:3px; }
  .theme-check{ font-size:18px; color: var(--brass); flex-shrink:0; opacity:0; }
  .theme-card.selected .theme-check{ opacity:1; }

  .color-picker-grid{ display:flex; flex-wrap:wrap; gap:14px; margin-top:10px; }
  .color-field{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    font-family: var(--font-mono); font-size:11px; color: var(--muted);
  }
  .color-field input[type="color"]{
    width:48px; height:48px; border-radius:50%; border:2px solid var(--petrol-3);
    padding:0; cursor:pointer; background:none;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <section class="screen active" id="screen-home">
    <div class="topbar">
      <h1>Packlistan</h1>
      <span style="display:flex; gap:8px; align-items:center;">
        <button class="icon-btn" id="btn-open-settings" title="Inställningar" aria-label="Inställningar">⚙️</button>
        <span class="plane" aria-hidden="true">✈️</span>
      </span>
    </div>
    <div class="trip-list" id="trip-list"></div>
    <div style="margin-top:14px;">
      <button class="new-trip-card" id="btn-new-trip">+ Ny resa</button>
    </div>
    <button class="btn secondary block" id="btn-toggle-archive" style="margin-top:14px;">📦 Visa arkiverade</button>
    <div class="trip-list hidden" id="archived-trip-list" style="margin-top:10px;"></div>
  </section>

  <!-- SETTINGS / THEME -->
  <section class="screen" id="screen-settings">
    <div class="topbar">
      <button class="icon-btn" id="btn-close-settings">←</button>
      <h1 style="font-size:22px;" id="settings-title">Inställningar</h1>
      <span style="width:38px;"></span>
    </div>

    <label id="appearance-section-label" class="section-label">Utseende</label>
    <div class="theme-grid" id="theme-grid"></div>

    <div class="field hidden" id="custom-theme-fields">
      <label style="margin-top:10px;" id="custom-colors-label">Egna färger</label>
      <div class="color-picker-grid">
        <label class="color-field"><span id="color-label-bg">Bakgrund</span><input type="color" id="color-petrol"></label>
        <label class="color-field"><span id="color-label-surface">Kort / yta</span><input type="color" id="color-petrol2"></label>
        <label class="color-field"><span id="color-label-text">Text</span><input type="color" id="color-sand"></label>
        <label class="color-field"><span id="color-label-accent">Accent</span><input type="color" id="color-brass"></label>
        <label class="color-field"><span id="color-label-done">Klarmarkering</span><input type="color" id="color-coral"></label>
      </div>
    </div>

    <button class="btn secondary block" id="btn-reset-theme" style="margin-top:20px;">Återställ till standard</button>

    <div class="field" style="margin-top:28px;">
      <label id="language-label">Språk</label>
      <div class="chip-grid">
        <button class="lang-btn chip" id="lang-btn-sv" data-lang="sv">🇸🇪 Svenska</button>
        <button class="lang-btn chip" id="lang-btn-en" data-lang="en">🇬🇧 English</button>
        <button class="lang-btn chip" id="lang-btn-fr" data-lang="fr">🇫🇷 Français</button>
      </div>
    </div>

    <div class="field" style="margin-top:28px;">
      <label id="data-section-label" class="section-label">Data</label>
      <div style="display:flex; gap:10px;">
        <button class="btn secondary" style="flex:1;" id="btn-export-data">⬇️ Exportera data</button>
        <button class="btn secondary" style="flex:1;" id="btn-import-data">⬆️ Importera data</button>
      </div>
      <input type="file" id="import-file-input" accept="application/json" class="hidden">
    </div>
  </section>

  <!-- NEW TRIP -->
  <section class="screen" id="screen-new-trip">
    <div class="topbar">
      <button class="icon-btn" id="btn-cancel-new">←</button>
      <h1 style="font-size:22px;" id="new-trip-title">Ny resa</h1>
      <span style="width:38px;"></span>
    </div>

    <div class="field">
      <label for="input-dest" id="label-dest">Resmål</label>
      <input id="input-dest" placeholder="T.ex. Kreta, Sverige, Mormor..." maxlength="40">
    </div>
    <div class="field">
      <label for="input-owner" id="label-owner">Packar för</label>
      <input id="input-owner" placeholder="Mig, Emma, hela familjen..." maxlength="30">
    </div>
    <div class="date-row">
      <div class="field">
        <label for="input-start" id="label-depart">Avresa</label>
        <input id="input-start" type="date">
      </div>
      <div class="field">
        <label for="input-end" id="label-return">Hemresa</label>
        <input id="input-end" type="date">
      </div>
    </div>
    <div class="field">
      <label id="label-trip-type">Typ av resa (valfritt — förifyller listan)</label>
      <div class="chip-grid" id="trip-type-chips"></div>
    </div>

    <div class="form-actions">
      <button class="btn block" id="btn-create-trip">Skapa lista</button>
    </div>
  </section>

  <!-- TRIP DETAIL -->
  <section class="screen" id="screen-trip">
    <div class="topbar">
      <button class="icon-btn" id="btn-back-home">←</button>
      <span style="display:flex; gap:8px;">
        <button class="icon-btn" id="btn-duplicate-trip" title="Duplicera resa" aria-label="Duplicera resa">📋</button>
        <button class="icon-btn" id="btn-archive-trip" title="Arkivera resa" aria-label="Arkivera resa">📦</button>
        <button class="icon-btn" id="btn-share-trip" title="Dela lista" aria-label="Dela lista">📤</button>

  /* --- små färgverktyg för att härleda en hel palett ur ett fåtal valda färger --- */
  function hexToRgb(hex){
    hex = hex.replace('#','');
    if (hex.length === 3) hex = hex.split('').map(function(c){ return c+c; }).join('');
    var num = parseInt(hex, 16);
    return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
  }
  function rgbToHex(r,g,b){
    function h(v){ v = Math.max(0,Math.min(255,Math.round(v))); return v.toString(16).padStart(2,'0'); }
    return '#' + h(r) + h(g) + h(b);
  }
  function mix(hexA, hexB, weightB){
    var a = hexToRgb(hexA), b = hexToRgb(hexB);
    return rgbToHex(
      a.r + (b.r-a.r)*weightB,
      a.g + (b.g-a.g)*weightB,
      a.b + (b.b-a.b)*weightB
    );
  }
  function luminance(hex){
    var c = hexToRgb(hex);
    return (0.299*c.r + 0.587*c.g + 0.114*c.b); // 0 (mörk) .. 255 (ljus)
  }

  // Bygger en fullständig temapalett utifrån bara 5 användarvalda färger.
  function deriveCustomTheme(c){
    var isLight = luminance(c.petrol) > 150;
    return {

      petrol3: mix(c.petrol2, isLight ? '#000000' : '#FFFFFF', 0.08),
      sand: c.sand,
      sandDim: mix(c.sand, c.petrol, 0.4),
      brass: c.brass,
      brassDim: mix(c.brass, '#000000', 0.35),
      coral: c.coral,
      muted: mix(c.sand, c.petrol, 0.5),
      danger: '#D4483F',
      radius: '8px',
      fontDisplay: "'Space Grotesk', sans-serif"
    };
  }

  function applyTheme(){
    var vars = themeState.id === 'custom' ? deriveCustomTheme(themeState.custom) : THEMES[themeState.id];

    var root = document.documentElement.style;
    root.setProperty('--petrol', vars.petrol);
    root.setProperty('--petrol-2', vars.petrol2);
    root.setProperty('--petrol-3', vars.petrol3);
    root.setProperty('--sand', vars.sand);
    root.setProperty('--sand-dim', vars.sandDim);
    root.setProperty('--brass', vars.brass);
    root.setProperty('--brass-dim', vars.brassDim);
    root.setProperty('--coral', vars.coral);
    root.setProperty('--muted', vars.muted);
    root.setProperty('--danger', vars.danger);
    root.setProperty('--radius', vars.radius);
    root.setProperty('--font-display', vars.fontDisplay);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', vars.petrol);
  }

  // Egna (användarskapade) kategorier saknar catId och visas precis som de skrevs in.
  function tCat(cat){
    if (cat.catId && CATEGORY_STRING_KEY[cat.catId]) return t(CATEGORY_STRING_KEY[cat.catId]);
    return cat.name;
  }

  var STANDARD_ITEMS = {
    clothing: ['underwear', 'socks', 'sleepwear', 'tshirts', 'pants'],
    hygiene: ['toothbrush', 'toothpaste', 'deodorant', 'medicine'],
    electronics: ['phoneCharger'],
    documents: ['walletId'],
    other: []
  };

  var TRIP_TYPES = [
    { id:'beach',    labelKey:'tripTypeBeach',    icon:'🏖️', items:{ clothing:['swimwear','flipflops'], hygiene:['sunscreen','aftersun'], other:['towel','sunglasses'] } },
    { id:'winter',   labelKey:'tripTypeWinter',   icon:'🎿', items:{ clothing:['beanie','gloves','thermalUnderwear','nonSlipShoes'], other:['skiGoggles','handWarmers'] } },
    { id:'business', labelKey:'tripTypeBusiness', icon:'💼', items:{ clothing:['suit','extraShirt'], electronics:['laptopCharger','powerbank'], documents:['businessCards'] } },
    { id:'hiking',   labelKey:'tripTypeHiking',   icon:'🥾', items:{ clothing:['hikingBoots','rainJacket','extraSocks'], other:['backpack','mapCompass','bugSpray','waterBottle'] } },
    { id:'flight',   labelKey:'tripTypeFlight',   icon:'✈️', items:{ documents:['passport','travelInsurance','foreignCurrency','boardingPass'], electronics:['travelAdapter'] } },
    { id:'kids',     labelKey:'tripTypeKids',     icon:'🧸', items:{ other:['diapers','wetWipes','pacifiers','favoriteToy','snacks'] } }
  ];

  function byTypeId(id){ return TRIP_TYPES.filter(function(tt){ return tt.id === id; })[0] || null; }
  function tTripType(tripType){ return t(tripType.labelKey); }

  function makeId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  // Item-nycklar som typiskt byts varje dag — förbockade som "byts varje dag" när
  // de kommer från mallen. Användaren kan alltid bocka ur/i valfritt plagg manuellt ändå.
  var DEFAULT_DAILY_KEYS = ['underwear', 'socks', 'tshirts'];
  var ITEM_STRING_KEY = {
    underwear:'itemUnderwear', socks:'itemSocks', sleepwear:'itemSleepwear', tshirts:'itemTshirts', pants:'itemPants',
    toothbrush:'itemToothbrush', toothpaste:'itemToothpaste', deodorant:'itemDeodorant', medicine:'itemMedicine',
    phoneCharger:'itemPhoneCharger', walletId:'itemWalletId',
    swimwear:'itemSwimwear', flipflops:'itemFlipflops', sunscreen:'itemSunscreen', aftersun:'itemAftersun', towel:'itemTowel', sunglasses:'itemSunglasses',
    beanie:'itemBeanie', gloves:'itemGloves', thermalUnderwear:'itemThermalUnderwear', nonSlipShoes:'itemNonSlipShoes', skiGoggles:'itemSkiGoggles', handWarmers:'itemHandWarmers',
    suit:'itemSuit', extraShirt:'itemExtraShirt', laptopCharger:'itemLaptopCharger', powerbank:'itemPowerbank', businessCards:'itemBusinessCards',
    hikingBoots:'itemHikingBoots', rainJacket:'itemRainJacket', extraSocks:'itemExtraSocks', backpack:'itemBackpack', mapCompass:'itemMapCompass', bugSpray:'itemBugSpray', waterBottle:'itemWaterBottle',
    passport:'itemPassport', travelInsurance:'itemTravelInsurance', foreignCurrency:'itemForeignCurrency', boardingPass:'itemBoardingPass', travelAdapter:'itemTravelAdapter',
    diapers:'itemDiapers', wetWipes:'itemWetWipes', pacifiers:'itemPacifiers', favoriteToy:'itemFavoriteToy', snacks:'itemSnacks'
  };

  // Visningsnamn för en sak. Mall-saker (med itemKey) översätts via t().
  // Egna (fritt inskrivna) saker saknar itemKey och visas precis som de skrevs in.
  function tItem(item){
    if (item.itemKey && ITEM_STRING_KEY[item.itemKey]) return t(ITEM_STRING_KEY[item.itemKey]);
    return item.name;
  }

  function makeItem(name, dailyChange, itemKey){
    return { id: makeId(), name: name, qty: 1, packed: false, dailyChange: !!dailyChange, itemKey: itemKey || null };
  }

  // Antal nätter för resan, baserat på avresa/hemresa. null om datum saknas.
  function nightsForTrip(trip){
    if (!trip.startDate || !trip.endDate) return null;
    var start = new Date(trip.startDate + 'T00:00:00');
    var end = new Date(trip.endDate + 'T00:00:00');
    var diff = Math.round((end - start) / 86400000);
    return diff > 0 ? diff : 1;
  }

  // Räknar om antalet för alla plagg markerade "byts varje dag" utifrån resans längd.
  // Saknas datum antas 1 (och en hint visas i UI om att ange datum ger ett bättre svar).
  function recomputeDailyQuantities(trip){
    var nights = nightsForTrip(trip);
    var qty = nights || 1;
    trip.categories.forEach(function(cat){
      cat.items.forEach(function(item){
        if (item.dailyChange) item.qty = qty;
      });
    });
  }

  // Bygger kategorier+saker för en ny resa. Texten skrivs ut på det språk som
  // gäller just nu (currentLang) — men blir sedan vanlig fri text, precis som
  // om användaren skrivit in den själv, och översätts inte i efterhand.
  function buildCategoriesFromTemplate(selectedTypeIds){
    var cats = {};
    CATEGORY_ORDER.forEach(function(c){ cats[c] = []; });
    var seen = {}; // "categoryId::itemKey" -> true, för att undvika dubbletter

    function addTo(catId, itemKey){
      if (!cats[catId]) cats[catId] = [];
      var key = catId + '::' + itemKey;
      if (seen[key]) return;
      seen[key] = true;
      var label = ITEM_STRING_KEY[itemKey] ? t(ITEM_STRING_KEY[itemKey]) : itemKey;
      cats[catId].push(makeItem(label, DEFAULT_DAILY_KEYS.indexOf(itemKey) !== -1, itemKey));
    }

    Object.keys(STANDARD_ITEMS).forEach(function(catId){
      STANDARD_ITEMS[catId].forEach(function(key){ addTo(catId, key); });
    });
    selectedTypeIds.forEach(function(tid){
      var tt = byTypeId(tid);
      if (!tt) return;
      Object.keys(tt.items).forEach(function(catId){
        tt.items[catId].forEach(function(key){ addTo(catId, key); });
      });
    });

    return CATEGORY_ORDER
      .filter(function(c){ return cats[c] && cats[c].length > 0; })
      .map(function(c){ return { id: makeId(), catId: c, name: t(CATEGORY_STRING_KEY[c]), items: cats[c], collapsed:false }; });
  }

  /* =========================================================
     STATE
     ========================================================= */
  var trips = [];
  var currentTripId = null;
  var selectedTypeIds = [];

  function $(id){ return document.getElementById(id); }
  function showScreen(id){
    document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
    $(id).classList.add('active');
  }
  function getTrip(id){ return trips.filter(function(t){ return t.id === id; })[0] || null; }

  function persistTrips(){ Storage.set(TRIPS_KEY, trips); }

  function showToast(msg, actionLabel, actionFn){
    var el = $('toast');
    var actionBtn = $('toast-action');
    $('toast-msg').textContent = msg;
    clearTimeout(showToast._t);

    if (actionLabel && actionFn){
      actionBtn.textContent = actionLabel;
      actionBtn.classList.remove('hidden');
      actionBtn.onclick = function(){
        actionFn();
        el.classList.remove('show');
      };
    } else {
      actionBtn.classList.add('hidden');
      actionBtn.onclick = null;
    }

    el.classList.add('show');
    var duration = (actionLabel && actionFn) ? 5000 : 2200;
    showToast._t = setTimeout(function(){ el.classList.remove('show'); }, duration);
  }

  /* ---------- Ångra: ett kort fönster att återställa en borttagen sak/resa ---------- */
  var pendingUndo = null;
  function offerUndo(message, restoreFn){
    pendingUndo = restoreFn;
    showToast(message, t('undoBtn'), function(){
      if (pendingUndo){ pendingUndo(); pendingUndo = null; }
    });
  }

  /* =========================================================
     HOME
     ========================================================= */
  function tripProgress(trip){
    var total = 0, packed = 0;
    trip.categories.forEach(function(c){
      c.items.forEach(function(i){ total++; if (i.packed) packed++; });
    });
    return { total: total, packed: packed, pct: total ? Math.round(packed/total*100) : 0 };
  }

  function formatDateRange(trip){
    if (!trip.startDate && !trip.endDate) return t('noDatesSet');
    var opts = { day:'numeric', month:'short' };
    var locale = LOCALE_MAP[currentLang] || 'sv-SE';
    var s = trip.startDate ? new Date(trip.startDate+'T00:00:00').toLocaleDateString(locale, opts) : '?';
    var e = trip.endDate ? new Date(trip.endDate+'T00:00:00').toLocaleDateString(locale, opts) : '?';
    return s + ' \u2192 ' + e;
  }

  function sortTripsByDate(list){
    return list.slice().sort(function(a,b){
      var da = a.startDate ? new Date(a.startDate).getTime() : Infinity;
      var db = b.startDate ? new Date(b.startDate).getTime() : Infinity;
      return da - db;
    });
  }

  function renderTripCard(trip){
    var prog = tripProgress(trip);
    var card = document.createElement('button');
    card.className = 'trip-card';
    card.setAttribute('aria-label', t('openTripAriaPrefix') + trip.destination);
    var tagIcons = (trip.tripTypes||[]).map(function(id){ var tt = byTypeId(id); return tt ? tt.icon : ''; }).join(' ');
    var ownerBadge = trip.owner ? '<div class="trip-owner">👤 ' + escapeHtml(trip.owner) + '</div>' : '';
    card.innerHTML =
      '<div class="trip-card-main">' +
        '<div class="trip-dest">' + escapeHtml(trip.destination || t('namelessTrip')) + '</div>' +
        '<div class="trip-meta">' + escapeHtml(formatDateRange(trip)) + '</div>' +
        ownerBadge +
        (tagIcons ? '<div class="trip-tags"><span class="trip-tag">'+tagIcons+'</span></div>' : '') +
      '</div>' +
      '<div class="progress-badge">' +
        '<div class="ring" style="background: conic-gradient(var(--brass) ' + (prog.pct*3.6) + 'deg, var(--petrol-3) 0deg);">' +
          '<span>' + prog.pct + '%</span>' +
        '</div>' +
      '</div>';
    card.addEventListener('click', function(){ openTrip(trip.id); });
    return card;
  }

  function renderHome(){
    var list = $('trip-list');
    list.innerHTML = '';
    var active = sortTripsByDate(trips.filter(function(tr){ return !tr.archived; }));
    if (active.length === 0){
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = '<span class="big">🧳</span>' + escapeHtml(t('emptyTitle')) + '<br>' + escapeHtml(t('emptySub'));
      list.appendChild(empty);
    } else {
      active.forEach(function(trip){ list.appendChild(renderTripCard(trip)); });
    }
    renderArchivedList();
    updateArchiveToggleLabel();
  }

  function renderArchivedList(){
    var list = $('archived-trip-list');
    list.innerHTML = '';
    var archived = sortTripsByDate(trips.filter(function(tr){ return tr.archived; }));
    if (archived.length === 0){
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = t('archivedEmptyMsg');
      list.appendChild(empty);
      return;
    }
    archived.forEach(function(trip){ list.appendChild(renderTripCard(trip)); });
  }

  function updateArchiveToggleLabel(){
    var archivedCount = trips.filter(function(tr){ return tr.archived; }).length;
    var shown = !$('archived-trip-list').classList.contains('hidden');
    $('btn-toggle-archive').textContent = (shown ? t('archiveToggleHide') : t('archiveToggleShow')) + ' (' + archivedCount + ')';
  }

  $('btn-toggle-archive').addEventListener('click', function(){
    $('archived-trip-list').classList.toggle('hidden');
    updateArchiveToggleLabel();
  });

  function escapeHtml(str){
    var d = document.createElement('div');
    d.textContent = str == null ? '' : str;
    return d.innerHTML;
  }

  /* =========================================================
     NEW TRIP
     ========================================================= */
  function renderTripTypeChips(){
    var wrap = $('trip-type-chips');
    wrap.innerHTML = '';
    TRIP_TYPES.forEach(function(tripType){
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (selectedTypeIds.indexOf(tripType.id) !== -1 ? ' selected' : '');
      chip.innerHTML = '<span>' + tripType.icon + '</span><span>' + tTripType(tripType) + '</span>';
      chip.addEventListener('click', function(){
        var idx = selectedTypeIds.indexOf(tripType.id);
        if (idx === -1){ selectedTypeIds.push(tripType.id); chip.classList.add('selected'); }
        else { selectedTypeIds.splice(idx,1); chip.classList.remove('selected'); }
      });
      wrap.appendChild(chip);
    });
  }

  $('btn-new-trip').addEventListener('click', function(){
    selectedTypeIds = [];
    $('input-dest').value = '';
    $('input-owner').value = '';
    $('input-start').value = '';
    $('input-end').value = '';
    renderTripTypeChips();
    showScreen('screen-new-trip');
    $('input-dest').focus();
  });
  $('btn-cancel-new').addEventListener('click', function(){ showScreen('screen-home'); });

  $('btn-create-trip').addEventListener('click', function(){
    var dest = $('input-dest').value.trim() || t('namelessTrip');
    var trip = {
      id: makeId(),
      destination: dest,
      owner: $('input-owner').value.trim() || '',
      startDate: $('input-start').value || null,
      endDate: $('input-end').value || null,
      tripTypes: selectedTypeIds.slice(),
      categories: buildCategoriesFromTemplate(selectedTypeIds),
      viewMode: 'plan',
      archived: false
    };
    recomputeDailyQuantities(trip);
    trips.unshift(trip);
    persistTrips();
    renderHome();
    openTrip(trip.id);
  });

  /* =========================================================
     TRIP DETAIL
     ========================================================= */
  function openTrip(id){
    currentTripId = id;
    renderTripDetail();
    showScreen('screen-trip');
  }

  function duplicateTrip(trip){
    return {
      id: makeId(),
      destination: trip.destination + t('copySuffix'),
      owner: trip.owner || '',
      startDate: null, endDate: null,
      tripTypes: (trip.tripTypes || []).slice(),
      viewMode: 'plan',
      archived: false,
      categories: (trip.categories || []).map(function(cat){
        return {
          id: makeId(), catId: cat.catId || null, name: cat.name, collapsed: false,
          items: (cat.items || []).map(function(item){
            return { id: makeId(), name: item.name, itemKey: item.itemKey || null, qty: item.qty, packed: false, dailyChange: item.dailyChange };
          })
        };
      })
    };
  }

  $('btn-duplicate-trip').addEventListener('click', function(){
    var trip = getTrip(currentTripId);
    if (!trip) return;
    var copy = duplicateTrip(trip);
    recomputeDailyQuantities(copy);
    trips.unshift(copy);
    persistTrips();
    openTrip(copy.id);
  });

  $('btn-archive-trip').addEventListener('click', function(){
    var trip = getTrip(currentTripId);
    if (!trip) return;
    trip.archived = !trip.archived;
    persistTrips();
    currentTripId = null;
    renderHome();
    showScreen('screen-home');
  });

  function setTripMode(trip, mode){
    trip.viewMode = mode;
    persistTrips();
    renderTripDetail();
  }

  function renderTripHeader(trip){
    var header = $('detail-header');
    header.innerHTML = '';
    var mode = trip.viewMode || 'plan';

    if (mode === 'plan'){
      var destInput = document.createElement('input');
      destInput.className = 'detail-dest-input';
      destInput.value = trip.destination;
      destInput.maxLength = 40;
      destInput.setAttribute('aria-label', t('destAria'));
      destInput.addEventListener('blur', function(){
        trip.destination = destInput.value.trim() || t('namelessTrip');
        persistTrips();
      });
      header.appendChild(destInput);

      var ownerInput = document.createElement('input');
      ownerInput.className = 'detail-owner-input';
      ownerInput.value = trip.owner || '';
      ownerInput.maxLength = 30;
      ownerInput.placeholder = t('ownerFieldPlaceholder');
      ownerInput.setAttribute('aria-label', t('ownerAria'));
      ownerInput.addEventListener('blur', function(){
        trip.owner = ownerInput.value.trim();
        persistTrips();
      });
      header.appendChild(ownerInput);

      var dateRow = document.createElement('div');
      dateRow.className = 'detail-date-row';
      var startInput = document.createElement('input');
      startInput.type = 'date';
      startInput.value = trip.startDate || '';
      startInput.setAttribute('aria-label', t('departAria'));
      var endInput = document.createElement('input');
      endInput.type = 'date';
      endInput.value = trip.endDate || '';
      endInput.setAttribute('aria-label', t('returnAria'));
      function onDateChange(){
        trip.startDate = startInput.value || null;
        trip.endDate = endInput.value || null;
        recomputeDailyQuantities(trip);
        persistTrips();
        renderTripDetail();
      }
      startInput.addEventListener('change', onDateChange);
      endInput.addEventListener('change', onDateChange);
      dateRow.appendChild(startInput);
      dateRow.appendChild(endInput);
      header.appendChild(dateRow);
    } else {
      var dest = document.createElement('div');
      dest.className = 'detail-dest';
      dest.textContent = trip.destination;
      header.appendChild(dest);
      if (trip.owner){
        var ownerLabel = document.createElement('div');
        ownerLabel.className = 'trip-owner';
        ownerLabel.style.marginTop = '2px';
        ownerLabel.textContent = '👤 ' + trip.owner;
        header.appendChild(ownerLabel);
      }
      var meta = document.createElement('div');
      meta.className = 'detail-meta';
      meta.textContent = formatDateRange(trip);
      header.appendChild(meta);
    }

    var prog = tripProgress(trip);
    var track = document.createElement('div');
    track.className = 'progress-bar-track';
    track.innerHTML = '<div class="progress-bar-fill" style="width:' + prog.pct + '%"></div>';
    header.appendChild(track);
    var label = document.createElement('div');
    label.className = 'progress-label';
    label.textContent = prog.packed + ' / ' + prog.total + ' ' + t('packedLabel');
    header.appendChild(label);
  }

  function hasDailyItems(trip){
    return trip.categories.some(function(c){ return c.items.some(function(i){ return i.dailyChange; }); });
  }

  function renderTripDetail(){
    var trip = getTrip(currentTripId);
    if (!trip) { showScreen('screen-home'); return; }
    if (!trip.viewMode) trip.viewMode = 'plan';
    var mode = trip.viewMode;

    renderTripHeader(trip);

    var archiveLabel = trip.archived ? t('unarchiveTitle') : t('archiveTitle');
    $('btn-archive-trip').setAttribute('title', archiveLabel);
    $('btn-archive-trip').setAttribute('aria-label', archiveLabel);
    $('btn-archive-trip').textContent = trip.archived ? '📤' : '📦';

    document.querySelectorAll('.mode-btn').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-mode') === mode);
    });

    var showHint = mode === 'plan' && hasDailyItems(trip) && nightsForTrip(trip) === null;
    $('daily-hint').classList.toggle('hidden', !showHint);

    $('add-category-row').classList.toggle('hidden', mode !== 'plan');

    var catList = $('category-list');
    catList.innerHTML = '';
    trip.categories.forEach(function(cat){
      catList.appendChild(renderCategory(trip, cat, mode));
    });
  }

  document.querySelectorAll('.mode-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var trip = getTrip(currentTripId);
      if (!trip) return;
      setTripMode(trip, btn.getAttribute('data-mode'));
    });
  });

  function renderCategory(trip, cat, mode){
    var wrap = document.createElement('div');
    wrap.className = 'category' + (cat.collapsed ? ' collapsed' : '');

    var packedCount = cat.items.filter(function(i){ return i.packed; }).length;

    var header = document.createElement('div');
    header.className = 'category-header';
    header.innerHTML =
      '<h3>' + escapeHtml(tCat(cat)) + '</h3>' +
      '<div style="display:flex; align-items:center; gap:10px;">' +
        '<span class="category-count">' + packedCount + '/' + cat.items.length + '</span>' +
        '<span class="category-chevron">▾</span>' +
      '</div>';
    header.addEventListener('click', function(){
      cat.collapsed = !cat.collapsed;
      persistTrips();
      renderTripDetail();
    });
    wrap.appendChild(header);

    var body = document.createElement('div');
    body.className = 'category-body';

    cat.items.forEach(function(item){
      body.appendChild(renderItemRow(trip, cat, item, mode));
    });

    if (mode === 'plan'){
      var addRow = document.createElement('div');
      addRow.className = 'add-item-row';
      var input = document.createElement('input');
      input.placeholder = t('addItemPlaceholder');
      input.maxLength = 40;
      var addBtn = document.createElement('button');
      addBtn.textContent = '+';
      addBtn.setAttribute('aria-label', t('addItemAriaPrefix') + tCat(cat));
      function submitAdd(){
        var name = input.value.trim();
        if (!name) return;
        cat.items.push(makeItem(name));
        input.value = '';
        persistTrips();
        renderTripDetail();
      }
      addBtn.addEventListener('click', submitAdd);
      input.addEventListener('keydown', function(e){ if (e.key === 'Enter') submitAdd(); });
      addRow.appendChild(input);
      addRow.appendChild(addBtn);
      body.appendChild(addRow);
    }

    wrap.appendChild(body);
    return wrap;
  }

  function renderItemRow(trip, cat, item, mode){
    var row = document.createElement('div');
    row.className = 'item-row' + (mode === 'pack' ? ' pack-mode' : '');

    var check = document.createElement('button');
    check.className = 'stamp-check' + (item.packed ? ' packed' : '');
    check.setAttribute('data-item-id', item.id);
    check.setAttribute('aria-label', (item.packed ? t('unmarkAriaPrefix') : t('markPackedAriaPrefix')) + tItem(item));
    check.addEventListener('click', function(){
      item.packed = !item.packed;
      var wasJustPacked = item.packed;
      persistTrips();
      renderTripDetail();
      if (wasJustPacked){
        var freshCheck = document.querySelector('.stamp-check[data-item-id="' + item.id + '"]');
        if (freshCheck){
          freshCheck.classList.add('stamp-pop');
          setTimeout(function(){ freshCheck.classList.remove('stamp-pop'); }, 450);
        }
      }
    });
    row.appendChild(check);

    var main = document.createElement('div');
    main.className = 'item-main';

    var name = document.createElement('div');
    name.className = 'item-name' + (item.packed ? ' packed' : '');
    var displayName = mode === 'pack' && item.qty > 1 ? (tItem(item) + '  ×' + item.qty) : tItem(item);
    name.textContent = displayName;

    if (mode === 'plan'){
      name.classList.add('item-name-editable');
      name.setAttribute('tabindex', '0');
      name.setAttribute('role', 'button');
      name.setAttribute('aria-label', t('editItemAriaPrefix') + tItem(item));
      var startEdit = function(){
        var input = document.createElement('input');
        input.className = 'item-name-input';
        input.value = tItem(item);
        input.maxLength = 40;
        main.replaceChild(input, name);
        input.focus();
        input.select();
        function commit(){
          var newName = input.value.trim();
          if (newName && newName !== tItem(item)){
            item.name = newName;
            item.itemKey = null; // en redigerad sak är inte längre kopplad till mallöversättningen
          }
          persistTrips();
          renderTripDetail();
        }
        input.addEventListener('blur', commit);
        input.addEventListener('keydown', function(e){
          if (e.key === 'Enter') input.blur();
          if (e.key === 'Escape'){ input.removeEventListener('blur', commit); renderTripDetail(); }
        });
      };
      name.addEventListener('click', startEdit);
      name.addEventListener('keydown', function(e){ if (e.key === 'Enter') startEdit(); });
    }

    main.appendChild(name);

    if (mode === 'plan'){
      var chip = document.createElement('button');
      chip.className = 'daily-chip' + (item.dailyChange ? ' active' : '');
      chip.textContent = item.dailyChange ? t('dailyChipOn') : t('dailyChipOff');
      chip.setAttribute('aria-pressed', item.dailyChange ? 'true' : 'false');
      chip.addEventListener('click', function(){
        item.dailyChange = !item.dailyChange;
        recomputeDailyQuantities(trip);
        persistTrips();
        renderTripDetail();
      });
      main.appendChild(chip);
    }
    row.appendChild(main);

    if (mode === 'plan'){
      if (item.dailyChange){
        var pill = document.createElement('div');
        pill.className = 'qty-auto-pill';
        pill.textContent = item.qty + 'x';
        pill.title = t('autoQtyTitle');
        row.appendChild(pill);
      } else {
        var stepper = document.createElement('div');
        stepper.className = 'qty-stepper';
        var minus = document.createElement('button');
        minus.textContent = '−';
        minus.setAttribute('aria-label', t('decreaseQtyAriaPrefix') + tItem(item));
        minus.addEventListener('click', function(){
          if (item.qty > 1){ item.qty--; persistTrips(); renderTripDetail(); }
        });
        var qtySpan = document.createElement('span');
        qtySpan.textContent = item.qty + 'x';
        var plus = document.createElement('button');
        plus.textContent = '+';
        plus.setAttribute('aria-label', t('increaseQtyAriaPrefix') + tItem(item));
        plus.addEventListener('click', function(){
          item.qty++; persistTrips(); renderTripDetail();
        });
        stepper.appendChild(minus); stepper.appendChild(qtySpan); stepper.appendChild(plus);
        row.appendChild(stepper);
      }

      var del = document.createElement('button');
      del.className = 'item-delete';
      del.textContent = '✕';
      del.setAttribute('aria-label', t('deleteItemAriaPrefix') + tItem(item));
      del.addEventListener('click', function(){
        var removedIndex = cat.items.indexOf(item);
        cat.items = cat.items.filter(function(i){ return i.id !== item.id; });
        persistTrips();
        renderTripDetail();
        offerUndo(t('itemDeletedPrefix') + tItem(item), function(){
          cat.items.splice(Math.min(removedIndex, cat.items.length), 0, item);
          persistTrips();
          renderTripDetail();
        });
      });
      row.appendChild(del);
    }

    return row;
  }

  $('btn-add-category').addEventListener('click', function(){
    var trip = getTrip(currentTripId);
    var name = $('input-new-category').value.trim();
    if (!trip || !name) return;
    trip.categories.push({ id: makeId(), catId: null, name: name, items: [], collapsed:false });
    $('input-new-category').value = '';
    persistTrips();
    renderTripDetail();
  });
  $('input-new-category').addEventListener('keydown', function(e){
    if (e.key === 'Enter') $('btn-add-category').click();
  });

  $('btn-back-home').addEventListener('click', function(){
    currentTripId = null;
    renderHome();
    showScreen('screen-home');
  });

  $('btn-delete-trip').addEventListener('click', function(){
    var trip = getTrip(currentTripId);
    if (!trip) return;
    var removedIndex = trips.indexOf(trip);
    trips = trips.filter(function(tr){ return tr.id !== trip.id; });
    persistTrips();
    currentTripId = null;
    renderHome();
    showScreen('screen-home');
    offerUndo(t('tripDeletedPrefix') + trip.destination, function(){
      trips.splice(Math.min(removedIndex, trips.length), 0, trip);
      persistTrips();
      renderHome();
    });
  });

  $('btn-share-trip').addEventListener('click', async function(){
    var trip = getTrip(currentTripId);
    if (!trip) return;
    var lines = [
      t('shareListPrefix') + trip.destination + (trip.owner ? ' (' + trip.owner + ')' : ''),
      formatDateRange(trip), ''
    ];
    trip.categories.forEach(function(cat){
      if (cat.items.length === 0) return;
      lines.push(tCat(cat) + ':');
      cat.items.forEach(function(i){
        lines.push((i.packed ? '[x] ' : '[ ] ') + tItem(i) + (i.qty > 1 ? ' (' + i.qty + 'x)' : ''));
      });
      lines.push('');
    });
    var text = lines.join('\n');
    if (navigator.share){
      try{ await navigator.share({ title: t('shareListPrefix') + trip.destination + (trip.owner ? ' (' + trip.owner + ')' : ''), text: text }); return; }catch(e){ /* avbrutet av användaren, gör inget */ return; }
    }
    try{
      await navigator.clipboard.writeText(text);
      showToast(t('toastCopied'));
    }catch(e){
      showToast(t('toastCopyFailed'));
    }
  });

  /* =========================================================
     TEMAVAL — UI-koppling
     ========================================================= */
  function renderThemeGrid(){
    var grid = $('theme-grid');
    grid.innerHTML = '';

    Object.keys(THEMES).forEach(function(id){
      var theme = THEMES[id];
      var card = document.createElement('button');
      card.className = 'theme-card' + (themeState.id === id ? ' selected' : '');
      card.innerHTML =
        '<span class="theme-swatch" style="background: linear-gradient(135deg, ' + theme.petrol + ' 50%, ' + theme.brass + ' 50%);"></span>' +
        '<span class="theme-card-text"><span class="name">' + t(theme.labelKey) + '</span><span class="desc">' + t(theme.descKey) + '</span></span>' +
        '<span class="theme-check">✓</span>';
      card.addEventListener('click', function(){ selectTheme(id); });
      grid.appendChild(card);
    });

    var customCard = document.createElement('button');
    customCard.className = 'theme-card' + (themeState.id === 'custom' ? ' selected' : '');
    var cc = themeState.custom;
    customCard.innerHTML =
      '<span class="theme-swatch" style="background: linear-gradient(135deg, ' + cc.petrol + ' 50%, ' + cc.brass + ' 50%);"></span>' +
      '<span class="theme-card-text"><span class="name">' + t('themeCustomName') + '</span><span class="desc">' + t('themeCustomDesc') + '</span></span>' +
      '<span class="theme-check">✓</span>';
    customCard.addEventListener('click', function(){ selectTheme('custom'); });
    grid.appendChild(customCard);

    $('custom-theme-fields').classList.toggle('hidden', themeState.id !== 'custom');
    $('color-petrol').value = cc.petrol;
    $('color-petrol2').value = cc.petrol2;
    $('color-sand').value = cc.sand;
    $('color-brass').value = cc.brass;
    $('color-coral').value = cc.coral;
  }

  function selectTheme(id){
    themeState.id = id;
    applyTheme();
    persistTheme();
    renderThemeGrid();
  }

  ['petrol','petrol2','sand','brass','coral'].forEach(function(key){
    $('color-' + key).addEventListener('input', function(e){
      themeState.custom[key] = e.target.value;
      themeState.id = 'custom';
      applyTheme();
      persistTheme();
    });
    $('color-' + key).addEventListener('change', function(){ renderThemeGrid(); });
  });

  $('btn-open-settings').addEventListener('click', function(){
    renderThemeGrid();
    showScreen('screen-settings');
  });
  $('btn-close-settings').addEventListener('click', function(){ showScreen('screen-home'); });
  $('btn-reset-theme').addEventListener('click', function(){
    themeState = { id:'resedokument', custom: { petrol:'#16323A', petrol2:'#1E4048', sand:'#F1E9D8', brass:'#C89B3C', coral:'#E4633F' } };
    applyTheme();
    persistTheme();
    renderThemeGrid();
    showToast(t('themeResetToast'));
  });

  /* =========================================================
     EXPORT / IMPORT — säkerhetskopiera eller flytta all data
     ========================================================= */
  $('btn-export-data').addEventListener('click', function(){
    var payload = {
      app: 'packlistan', version: 1, exportedAt: new Date().toISOString(),
      language: currentLang, theme: themeState, trips: trips
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'packlistan-backup-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  });

  $('btn-import-data').addEventListener('click', function(){
    $('import-file-input').click();
  });
  $('import-file-input').addEventListener('change', function(e){
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var data;
      try{ data = JSON.parse(reader.result); }
      catch(err){ showToast(t('importErrorToast')); e.target.value = ''; return; }
      if (!data || data.app !== 'packlistan' || !Array.isArray(data.trips)){
        showToast(t('importInvalidToast')); e.target.value = ''; return;
      }
      if (!confirm(t('importConfirm'))){ e.target.value = ''; return; }

      trips = data.trips.map(migrateTrip);
      persistTrips();

      if (data.theme && data.theme.id){
        themeState = data.theme;
        applyTheme();
        persistTheme();
      }
      if (data.language && SUPPORTED_LANGS.indexOf(data.language) !== -1){
        currentLang = data.language;
        document.documentElement.setAttribute('lang', currentLang);
        persistLanguage();
        applyStaticStrings();
        renderLanguagePicker();
      }
      renderThemeGrid();
      currentTripId = null;
      renderHome();
      showScreen('screen-home');
      showToast(t('importSuccessToast'));
      e.target.value = '';
    };
    reader.onerror = function(){ showToast(t('importErrorToast')); e.target.value = ''; };
    reader.readAsText(file);
  });

  /* =========================================================
     SPRÅKVAL — UI-koppling
     ========================================================= */
  function renderLanguagePicker(){
    document.querySelectorAll('.lang-btn').forEach(function(btn){
      btn.classList.toggle('selected', btn.getAttribute('data-lang') === currentLang);
    });
  }

  function setLanguage(lang){
    if (SUPPORTED_LANGS.indexOf(lang) === -1) return;
    currentLang = lang;
    document.documentElement.setAttribute('lang', lang);
    persistLanguage();
    applyStaticStrings();
    renderLanguagePicker();
    renderThemeGrid();
    if (getTrip(currentTripId)) { renderTripDetail(); } else { renderHome(); }
  }

  document.querySelectorAll('.lang-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ setLanguage(btn.getAttribute('data-lang')); });
  });

  // Sätter all statisk UI-text (knappar, etiketter, platshållare) på aktuellt språk.
  function applyStaticStrings(){
    $('btn-open-settings').setAttribute('title', t('settingsTitle'));
    $('btn-open-settings').setAttribute('aria-label', t('settingsTitle'));
    $('btn-new-trip').textContent = t('newTrip');
    updateArchiveToggleLabel();

    $('settings-title').textContent = t('settingsTitle');
    $('appearance-section-label').textContent = t('appearance');
    $('custom-colors-label').textContent = t('customColors');
    $('color-label-bg').textContent = t('colorBg');
    $('color-label-surface').textContent = t('colorSurface');
    $('color-label-text').textContent = t('colorText');
    $('color-label-accent').textContent = t('colorAccent');
    $('color-label-done').textContent = t('colorDone');
    $('btn-reset-theme').textContent = t('resetTheme');
    $('language-label').textContent = t('languageLabel');
    $('lang-btn-sv').textContent = '🇸🇪 ' + t('langSv');
    $('lang-btn-en').textContent = '🇬🇧 ' + t('langEn');
    $('lang-btn-fr').textContent = '🇫🇷 ' + t('langFr');

    $('new-trip-title').textContent = t('newTripTitle');
    $('label-dest').textContent = t('destLabel');
    $('input-dest').setAttribute('placeholder', t('destPlaceholder'));
    $('label-owner').textContent = t('ownerLabel');
    $('input-owner').setAttribute('placeholder', t('ownerPlaceholder'));
    $('label-depart').textContent = t('departLabel');
    $('label-return').textContent = t('returnLabel');
    $('label-trip-type').textContent = t('tripTypeLabel');
    $('btn-create-trip').textContent = t('createList');

    $('btn-share-trip').setAttribute('title', t('shareTitle'));
    $('btn-share-trip').setAttribute('aria-label', t('shareTitle'));
    $('btn-delete-trip').setAttribute('title', t('deleteTripTitle'));
    $('btn-delete-trip').setAttribute('aria-label', t('deleteTripTitle'));
    $('btn-duplicate-trip').setAttribute('title', t('duplicateTitle'));
    $('btn-duplicate-trip').setAttribute('aria-label', t('duplicateTitle'));
    document.querySelector('.mode-btn[data-mode="plan"]').textContent = t('planMode');
    document.querySelector('.mode-btn[data-mode="pack"]').textContent = t('packMode');
    $('daily-hint').textContent = t('dailyHint');
    $('input-new-category').setAttribute('placeholder', t('addCategoryPlaceholder'));
    $('btn-add-category').setAttribute('aria-label', t('addCategoryAria'));

    $('data-section-label').textContent = t('dataSectionLabel');
    $('btn-export-data').textContent = t('exportTitle');
    $('btn-import-data').textContent = t('importTitle');

    if (getTrip(currentTripId)){
      var openTrip_ = getTrip(currentTripId);
      var archiveLabel = openTrip_.archived ? t('unarchiveTitle') : t('archiveTitle');
      $('btn-archive-trip').setAttribute('title', archiveLabel);
      $('btn-archive-trip').setAttribute('aria-label', archiveLabel);
    }

    renderTripTypeChips();
  }

  /* =========================================================
     LADDA SPARAD DATA
     ========================================================= */
  Storage.get(LANG_KEY).then(function(saved){
    if (saved && SUPPORTED_LANGS.indexOf(saved) !== -1){
      currentLang = saved;
      document.documentElement.setAttribute('lang', saved);
    }
    applyStaticStrings();
    renderLanguagePicker();
  }).catch(function(){ applyStaticStrings(); renderLanguagePicker(); });

  Storage.get(THEME_KEY).then(function(saved){
    if (saved && saved.id){
      themeState = saved;
      applyTheme();
    }
  }).catch(function(){});

  // Migrerar äldre sparade resor (från innan flerspråksstödet) så att inbyggda
  // kategorier och saker får rätt catId/itemKey och kan översättas live.
  // Bygger en omvänd uppslagning: text (på vilket av de tre språken som helst) -> nyckel.
  function buildReverseLookup(stringKeyMap){
    var map = {};
    Object.keys(stringKeyMap).forEach(function(id){
      var stringKey = stringKeyMap[id];
      SUPPORTED_LANGS.forEach(function(lang){
        var text = STRINGS[lang] && STRINGS[lang][stringKey];
        if (text) map[text.toLowerCase()] = id;
      });
    });
    return map;
  }
  var REVERSE_CATEGORY_LOOKUP = buildReverseLookup(CATEGORY_STRING_KEY);
  var REVERSE_ITEM_LOOKUP = buildReverseLookup(ITEM_STRING_KEY);

  function migrateTrip(trip){
    if (trip.owner === undefined) trip.owner = '';
    if (!trip.viewMode) trip.viewMode = 'plan';
    if (trip.archived === undefined) trip.archived = false;
    (trip.categories || []).forEach(function(cat){
      if (cat.catId === undefined){
        cat.catId = REVERSE_CATEGORY_LOOKUP[(cat.name || '').toLowerCase()] || null;
      }
      (cat.items || []).forEach(function(item){
        if (item.dailyChange === undefined) item.dailyChange = false;
        if (item.itemKey === undefined){
          item.itemKey = REVERSE_ITEM_LOOKUP[(item.name || '').toLowerCase()] || null;
        }
      });
    });
    return trip;
  }

  Storage.get(TRIPS_KEY).then(function(saved){
    if (saved && Array.isArray(saved)) trips = saved.map(migrateTrip);
    renderHome();
  }).catch(function(){ renderHome(); });

})();
</script>
<script>
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
</script>
</body>
</html>
