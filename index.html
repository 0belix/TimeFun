<!DOCTYPE html>
<html lang="sv" data-theme="funkis">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />

<link rel="manifest" href="manifest.json" />

<link rel="apple-touch-icon" href="icon-192.png" />

<meta name="apple-mobile-web-app-capable" content="yes" />

<style>
  /* ==========================================================================
     BASTOKENS
     Temablocken längre ner skriver över färger och typsnitt. Allt som inte är
     temaberoende (mått, radier, lager, skuggor) definieras en gång här.
     ========================================================================== */
  :root {
    --shadow-panel: 0 10px 40px rgba(0, 0, 0, 0.45);
    --shadow-card: 0 3px 10px rgba(0, 0, 0, 0.35);

    --radius-panel: 18px;
    --radius-field: 10px;
    --radius-key: 8px;
    --radius-pill: 999px;

    --overlay-backdrop: rgba(0, 0, 0, 0.72);
    --toast-background: rgba(0, 0, 0, 0.72);
    --control-background: rgba(128, 128, 128, 0.15);
    --control-border: rgba(128, 128, 128, 0.40);

    --flip-card-height: 1.32em;
    --flip-leaf-duration: 130ms;
    /* Opak yta: ett genomskinligt kort låter det vikande bladet lysa igenom
       och då faller hela illusionen. */
    --flip-card-face: color-mix(in srgb, var(--foreground-color) 15%, var(--background-color));
    --flip-card-seam: color-mix(in srgb, var(--background-color) 70%, #000000);

    --compact-layout: 0;
    --dial-glow: none;
    --dial-font-weight: 500;
    --digital-letter-spacing: 0.06em;
    --name-letter-spacing: 0.01em;
    --name-transform: none;

    --layer-effects: 40;
    --layer-toast: 45;
    --layer-overlay: 50;
    --layer-flash: 60;
    --flash-pulse-duration: 1s;
    --flash-pulse-count: 4;
  }

  /* ---------- Tema 1: Funkis — svensk funktionalism, 1950-tal ----------
     Grundad i instrumentpanelen på en PV: vinröd lack, mässingsdetaljer
     och en geometrisk grotesk i Futura-familjen. */
  :root[data-theme="funkis"] {
    --background-color: #2E181B;
    --foreground-color: #EFE2CE;
    --dial-accent: #C9A227;
    --dial-muted: #8C6A3F;
    --second-hand-color: #C9A227;
    --snow-color: #EFE2CE;

    --interface-font: 'Jost', system-ui, sans-serif;
    --dial-font: 'Jost', system-ui, sans-serif;
    --digital-font: 'Jost', system-ui, sans-serif;
    --dial-font-weight: 500;

    --panel-background: #241316;
    --panel-foreground: #EFE2CE;
    --panel-heading: #A98A5B;
    --panel-label: #D6C4A8;
    --panel-field-background: #180D0F;
    --panel-border: rgba(201, 162, 39, 0.35);
    --panel-surface: rgba(201, 162, 39, 0.10);
    --panel-surface-strong: rgba(201, 162, 39, 0.26);
    --accent-color: #C9A227;
    --accent-foreground: #241316;
    --danger-color: #E88B7D;
    --danger-surface: rgba(232, 139, 125, 0.22);
  }

  /* ---------- Tema 2: Deco — Art Deco ----------
     Champagne på nattsvart, hårfina guldlinjer och en solstråleutgång
     bakom urtavlan. Visarna är romber, inte batonger. */
  :root[data-theme="deco"] {
    --background-color: #0B0B0D;
    --foreground-color: #EFE6D2;
    --dial-accent: #D4AF6A;
    --dial-muted: #6E5C3A;
    --second-hand-color: #D4AF6A;
    --snow-color: #EFE6D2;

    --interface-font: 'Poiret One', 'Jost', sans-serif;
    --dial-font: 'Poiret One', serif;
    --digital-font: 'Poiret One', serif;
    --dial-font-weight: 400;
    --digital-letter-spacing: 0.14em;
    --name-letter-spacing: 0.16em;
    --name-transform: uppercase;

    --panel-background: #121214;
    --panel-foreground: #EFE6D2;
    --panel-heading: #8C7745;
    --panel-label: #CFC3A6;
    --panel-field-background: #08080A;

    --danger-color: #E0918A;
    --danger-surface: rgba(224, 145, 138, 0.20);
    --overlay-backdrop: rgba(0, 0, 0, 0.82);
  }

  /* ---------- Tema 3: Station — svensk stationsklocka ----------

  /* ---------- Rolfs ursprungliga urtavlor ----------

  :root[data-theme="classic-luxury"] {

  /* ==========================================================================
     LAYOUT
     ========================================================================== */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: var(--background-color);
    color: var(--foreground-color);
    font-family: var(--interface-font);
    user-select: none;
    transition: background 0.35s ease, color 0.35s ease;
  }

  .is-hidden { display: none !important; }
  .noscript-message { color: var(--foreground-color); padding: 2rem; text-align: center; }

  :focus-visible {
    outline: 2px solid var(--accent-color);
    outline-offset: 3px;
  }

  #app {
    height: 100vh;
    height: 100dvh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.6vmin;
    padding: 2.5vmin;
  }

  #effects-canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: var(--layer-effects);
  }

  /* ---------- Digital klocka ---------- */
  #digital-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1vmin;
    touch-action: pan-y;
  }
  #digital-clock {
    font-family: var(--digital-font);
    color: var(--foreground-color);
    font-size: clamp(2.2rem, 9vmin, 5.5rem);
    letter-spacing: var(--digital-letter-spacing);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: center;
    gap: 0.15em;
    filter: var(--dial-glow);
  }
  #digital-clock.style-flip { gap: 0.5vmin; letter-spacing: 0; }
  .flip-card {
    position: relative;
    display: inline-block;
    height: var(--flip-card-height);
    font-weight: 600;
    /* Varje kort är en egen mekanism med egen försvinningspunkt — sitter
       perspektivet på hela raden snedvrids ytterkorten. */
    perspective: 26em;
    transform-style: preserve-3d;
  }
  /* Osynlig mätsiffra som ger kortet sin bredd — halvorna är absolut
     positionerade och kan därför inte bära bredden själva. */
  .flip-sizer {
    display: block;
    visibility: hidden;
    padding: 0 0.16em;
    min-width: 0.6em;
    text-align: center;
    line-height: var(--flip-card-height);
  }

  .flip-half, .flip-leaf {
    position: absolute;
    left: 0;
    right: 0;
    height: 50%;
    overflow: hidden;
    background: var(--flip-card-face);
    box-shadow: var(--shadow-card);
  }
  .flip-half > span, .flip-leaf > span {
    display: block;
    height: 200%;
    line-height: var(--flip-card-height);
    text-align: center;
  }
  .flip-half-top, .flip-leaf-top {
    top: 0;
    border-radius: 0.12em 0.12em 0 0;
    /* Skarven där de två bladen möts */
    border-bottom: 1px solid var(--flip-card-seam);
  }
  .flip-half-bottom, .flip-leaf-bottom {
    bottom: 0;
    border-radius: 0 0 0.12em 0.12em;
  }
  /* Nedre halvan visar siffrans underdel genom att skjutas upp ett halvt kort */
  .flip-half-bottom > span, .flip-leaf-bottom > span { transform: translateY(-50%); }

  .flip-leaf { visibility: hidden; backface-visibility: hidden; }
  .flip-leaf-top { transform-origin: bottom; }
  .flip-leaf-bottom { transform-origin: top; }

  /* Ljuset faller av när bladet vinklas. Det är skuggan som gör att pappret
     känns fysiskt i stället för som en utbytt textsträng. */
  .flip-leaf::after {
    content: "";
    position: absolute;
    inset: 0;
    background: #000000;
    opacity: 0;
  }

  .flip-card.is-flipping .flip-leaf { visibility: visible; }
  .flip-card.is-flipping .flip-leaf-top {
    animation: flip-leaf-fall var(--flip-leaf-duration) cubic-bezier(0.55, 0.02, 0.85, 0.35) both;
  }
  .flip-card.is-flipping .flip-leaf-top::after {
    animation: flip-shade-deepen var(--flip-leaf-duration) linear both;
  }
  /* Landar först när det övre bladet fallit klart, och studsar till mot
     stoppet — det är den studsen som är själva klicket. */
  .flip-card.is-flipping .flip-leaf-bottom {
    animation: flip-leaf-land var(--flip-leaf-duration) cubic-bezier(0.2, 1.55, 0.5, 1)
               var(--flip-leaf-duration) both;
  }
  .flip-card.is-flipping .flip-leaf-bottom::after {
    animation: flip-shade-lift var(--flip-leaf-duration) linear var(--flip-leaf-duration) both;
  }

  /* Sveper med en CSS-animation i stället för en requestAnimationFrame-loop.
     Webbläsaren kan då driva rörelsen utan att väcka JavaScript 60 ggr/s —
     avgörande på en platta som sitter på väggen dygnet runt. */
  #clock .hand-second.is-sweeping {
    animation: station-sweep var(--sweep-cycle) linear infinite;
  }
  @keyframes station-sweep {
    0% { transform: translate(var(--dial-center), var(--dial-center)) rotate(0deg); }
    /* 58,5 s av 60 = 97,5 % — resten är vilan vid tolv */
    97.5% { transform: translate(var(--dial-center), var(--dial-center)) rotate(360deg); }
    100% { transform: translate(var(--dial-center), var(--dial-center)) rotate(360deg); }
  }

  @keyframes flip-leaf-fall {
    from { transform: rotateX(0deg); }
    to   { transform: rotateX(-90deg); }
  }
  @keyframes flip-leaf-land {
    from { transform: rotateX(90deg); }
    to   { transform: rotateX(0deg); }
  }
  @keyframes flip-shade-deepen { from { opacity: 0; } to { opacity: 0.45; } }
  @keyframes flip-shade-lift { from { opacity: 0.45; } to { opacity: 0; } }

  .flip-colon { opacity: 0.65; padding: 0 0.3vmin; }

  /* ---------- Analog klocka ---------- */
  #clock-wrap {
    width: min(60vmin, 82vw);
    height: min(60vmin, 82vw);
    flex-shrink: 0;
    touch-action: pan-y;
  }
  #clock {
    width: 100%;
    height: 100%;
    display: block;
    filter: var(--dial-glow);
  }
  #clock .rim { stroke: var(--dial-muted); fill: none; }
  #clock .chapter-ring { stroke: var(--dial-muted); fill: none; opacity: 0.7; }
  #clock .sunburst-ray { stroke: var(--dial-muted); opacity: 0.55; }
  #clock .tick-hour { stroke: var(--dial-accent); stroke-linecap: butt; }
  #clock .tick-minute { stroke: var(--dial-muted); stroke-linecap: butt; }
  #clock .number {
    fill: var(--foreground-color);
    font-family: var(--dial-font);
    font-weight: var(--dial-font-weight);
  }
  #clock .monogram { fill: var(--dial-accent); font-family: var(--dial-font); }
  #clock .monogram-ring { stroke: var(--dial-accent); fill: none; opacity: 0.65; }
  #clock .hand-hour, #clock .hand-minute {
    fill: var(--foreground-color);
    stroke: var(--foreground-color);
    stroke-linejoin: round;
    stroke-linecap: round;
  }
  #clock .hand-second {
    fill: var(--second-hand-color);
    stroke: var(--second-hand-color);
    stroke-linecap: round;
  }
  #clock .hub-outer { fill: var(--dial-accent); }
  #clock .hub-inner { fill: var(--background-color); }

  /* ---------- Karusell-prickar ---------- */
  .style-dots { display: flex; gap: 1vmin; }
  .style-dots .dot {
    width: clamp(6px, 1vmin, 9px);
    height: clamp(6px, 1vmin, 9px);
    border-radius: 50%;
    background: var(--foreground-color);
    opacity: 0.28;
    transition: opacity 0.2s ease;
  }
  .style-dots .dot.is-active { opacity: 1; background: var(--dial-accent); }

  /* Fyra pulser på fyra sekunder, alltså 1 Hz — långt under gränsen där
     blinkande ytor blir en risk för ljuskänsliga. */
  #page-flash {
    position: fixed;
    inset: 0;
    background: var(--accent-color);
    opacity: 0;
    pointer-events: none;
    z-index: var(--layer-flash);
  }
  #page-flash.is-flashing {
    animation: page-flash var(--flash-pulse-duration) ease-in-out var(--flash-pulse-count);
  }
  @keyframes page-flash {
    0%, 100% { opacity: 0; }
    45% { opacity: 0.75; }
  }

  #style-toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--toast-background);
    color: var(--accent-color);
    padding: 1.4vmin 3.4vmin;
    border-radius: var(--radius-pill);
    font-size: clamp(1rem, 2.6vmin, 1.4rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    z-index: var(--layer-toast);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #style-toast.is-visible { opacity: 1; }

  #names {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 2vmin;
    flex-wrap: wrap;
    max-width: 92vw;
    color: var(--foreground-color);
    font-family: var(--interface-font);
    font-weight: 600;
    font-size: clamp(1.3rem, 4.4vmin, 2.6rem);
    letter-spacing: var(--name-letter-spacing);
    text-transform: var(--name-transform);
    min-height: 1.3em;
  }
  #names .separator { opacity: 0.55; font-weight: 300; }

  /* ---------- Visningsläge ---------- */
  #app.mode-analog #digital-wrap { display: none; }
  #app.mode-digital #clock-wrap,
  #app.mode-digital #clock-dots { display: none; }
  #app.mode-digital #digital-clock { font-size: clamp(3rem, 15vmin, 8.5rem); }
  #app.mode-analog #clock-wrap { width: min(76vmin, 90vw); height: min(76vmin, 90vw); }

  /* ---------- Flytande knappar ---------- */
  #settings-button, #fullscreen-button, #qr-button {
    position: fixed;
    width: clamp(40px, 6vmin, 56px);
    height: clamp(40px, 6vmin, 56px);
    border-radius: 50%;
    border: 1px solid var(--control-border);
    background: var(--control-background);
    color: var(--foreground-color);
    font-size: clamp(1rem, 2.6vmin, 1.4rem);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #settings-button { top: 1.6vmin; right: 1.6vmin; }
  #fullscreen-button { bottom: 1.6vmin; left: 1.6vmin; }
  #qr-button { bottom: 1.6vmin; right: 1.6vmin; }

  /* ---------- Rastnedräkning ---------- */
  #break-timer {
    position: fixed;
    top: 1.6vmin;
    left: 1.6vmin;
    background: var(--control-background);
    border: 1px solid var(--control-border);
    color: var(--foreground-color);
    border-radius: 14px;
    padding: 1vmin 2vmin;
    text-align: left;
    line-height: 1.3;
  }
  #break-label {
    font-size: clamp(0.75rem, 1.8vmin, 1rem);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    opacity: 0.7;
  }
  #break-countdown {
    font-size: clamp(1.1rem, 3vmin, 1.6rem);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Overlays ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: var(--overlay-backdrop);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: var(--layer-overlay);
  }
  .panel {
    background: var(--panel-background);
    color: var(--panel-foreground);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-panel);
    box-shadow: var(--shadow-panel);
  }
  .primary-button {
    background: var(--accent-color);
    color: var(--accent-foreground);
    border: none;
    font-family: var(--interface-font);
    font-weight: 600;
    letter-spacing: 0.06em;
    border-radius: var(--radius-pill);
    cursor: pointer;
  }

  #settings-panel {
    padding: 3.4vmin;
    width: min(92vw, 440px);
    max-height: 88vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 1.9vmin;
  }
  #settings-panel h2 {
    margin: 0 0 0.2em;
    font-size: 1.3rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  #settings-panel h3 {
    margin: 0.4em 0 -0.6em;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--panel-heading);
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }
  #settings-panel label {
    display: flex;
    flex-direction: column;
    gap: 0.5em;
    font-size: 0.95rem;
    color: var(--panel-label);
  }
  #settings-panel input[type="text"],
  #settings-panel input[type="time"],
  #settings-panel select {
    font-family: var(--interface-font);
    color: var(--panel-foreground);
    border: 1px solid var(--panel-border);
    padding: 10px 14px;
    border-radius: var(--radius-field);
    font-size: 1rem;
  }
  #settings-panel input[type="text"],
  #settings-panel input[type="time"] { background: var(--panel-surface); }
  #settings-panel select { background: var(--panel-field-background); font-size: 1.05rem; }
  #settings-panel select option { background: var(--panel-field-background); }
  #settings-panel input[type="color"] {
    width: 100%;
    height: 42px;
    border: none;
    border-radius: var(--radius-field);
    background: none;
    padding: 0;
    cursor: pointer;
  }
  .color-row, .time-row { display: flex; gap: 2vmin; }
  .color-row label, .time-row label { flex: 1; }
  .checkbox-row { flex-direction: row !important; align-items: center; gap: 1em !important; }
  .checkbox-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent-color); }
  #settings-panel .primary-button { margin-top: 0.4em; padding: 12px 20px; font-size: 1rem; }
  .field-hint { margin: -0.6em 0 0; font-size: 0.85rem; color: var(--panel-heading); }
  .field-error { font-size: 0.85rem; color: var(--danger-color); }

  /* ---------- Skärmtangentbord (påskägg) ---------- */
  #keyboard-panel {
    padding: 3vmin;
    width: min(94vw, 640px);
    display: flex;
    flex-direction: column;
    gap: 1.6vmin;
  }
  #keyboard-display {
    background: var(--panel-surface);
    border-radius: 12px;
    padding: 1.4vmin;
    min-height: 1.6em;
    font-size: clamp(1.1rem, 3vmin, 1.6rem);
    text-align: center;
    letter-spacing: 0.12em;
  }
  .keyboard-row { display: flex; justify-content: center; gap: 0.6vmin; flex-wrap: wrap; }
  .keyboard-key {
    background: var(--panel-surface);
    border: 1px solid var(--panel-border);
    color: var(--panel-foreground);
    font-family: var(--interface-font);
    border-radius: var(--radius-key);
    padding: 1.6vmin 0;
    flex: 1 1 0;
    min-width: 24px;
    max-width: 60px;
    font-size: clamp(0.9rem, 2.4vmin, 1.2rem);
    cursor: pointer;
  }
  .keyboard-key:active { background: var(--panel-surface-strong); }
  .keyboard-key.is-wide { flex: 3 1 0; max-width: none; }
  .keyboard-key.is-close { background: var(--danger-surface); }

  /* ---------- Citat- och QR-panel ---------- */
  #quote-panel, #qr-panel {
    padding: 5vmin 4vmin;
    width: min(90vw, 560px);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.6vmin;
  }
  #quote-panel h2, #qr-panel h2 {
    margin: 0;
    font-size: 1.1rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--panel-heading);
  }
  #quote-text { font-size: clamp(1.2rem, 3.6vmin, 1.9rem); font-style: italic; line-height: 1.45; }
  #quote-author { font-size: clamp(0.9rem, 2.2vmin, 1.1rem); color: var(--panel-label); }
  #quote-panel .primary-button, #qr-panel .primary-button {
    align-self: center;
    margin-top: 0.6em;
    padding: 10px 24px;
  }
  #qr-code { width: min(60vw, 220px); height: auto; background: #fff; border-radius: 12px; padding: 2vmin; }
  #qr-hint { font-size: 0.95rem; color: var(--panel-label); }
  #qr-error { font-size: 0.9rem; color: var(--danger-color); }

  #wake-warning {
    position: fixed;
    bottom: 1.2vmin;
    left: 0;
    right: 0;
    text-align: center;
    font-size: clamp(0.7rem, 1.5vmin, 0.9rem);
    color: var(--foreground-color);
    opacity: 0.55;
  }


  /* ==========================================================================
     SMÅ FÖNSTER
     Två steg. "Kompakt" krymper allt och tar bort luft. "Litet" plockar bort
     allt utom själva tiden — vid den storleken finns det inget utrymme att
     kosta på namn, prickar och nedräkning.
     ========================================================================== */

  @media (max-height: 480px), (max-width: 420px) {
    #app { gap: 0.8vmin; padding: 1.4vmin; }

    #settings-button, #fullscreen-button, #qr-button {
      width: clamp(26px, 9vmin, 44px);
      height: clamp(26px, 9vmin, 44px);
      font-size: clamp(0.75rem, 4vmin, 1.1rem);
    }
    #settings-button { top: 1vmin; right: 1vmin; }
    #fullscreen-button { bottom: 1vmin; left: 1vmin; }
    #qr-button { bottom: 1vmin; right: 1vmin; }

    #break-timer { top: 1vmin; left: 1vmin; padding: 0.6vmin 1.2vmin; border-radius: 10px; }
    #break-label { font-size: clamp(0.5rem, 2.6vmin, 0.8rem); letter-spacing: 0.04em; }
    #break-countdown { font-size: clamp(0.75rem, 4vmin, 1.2rem); }

    #names { font-size: clamp(0.8rem, 5vmin, 1.6rem); min-height: 0; gap: 1vmin; }
    .style-dots { gap: 0.6vmin; }
    .style-dots .dot { width: 4px; height: 4px; }

    /* Bredden är det som tar slut först — åtta tecken ska rymmas på raden */
    #digital-clock { font-size: min(11vw, 14vmin); }
    #app.mode-digital #digital-clock { font-size: min(16vw, 26vmin); }
    #clock-wrap { width: min(50vmin, 60vw); height: min(50vmin, 60vw); }
    #app.mode-analog #clock-wrap { width: min(80vmin, 88vw); height: min(80vmin, 88vw); }

    #settings-panel { padding: 2.5vmin; gap: 1.4vmin; }
  }

  @media (max-height: 300px), (max-width: 260px) {
    /* Läses av JavaScript, som då släpper sekunderna. Brytpunkten finns
       därmed bara här och inte upprepad i koden. */
    :root { --compact-layout: 1; }

    #app { padding: 4px; gap: 3px; }

    /* Allt utom tiden bort. Nedräkningen och namnen kan läsas i stort läge. */
    #names, .style-dots, #wake-warning,
    #fullscreen-button, #qr-button { display: none !important; }

    #break-timer {
      top: 2px; left: 2px;
      padding: 2px 6px;
      border-radius: 8px;
      line-height: 1.15;
    }
    #break-label { font-size: 8px; letter-spacing: 0.03em; }
    #break-countdown { font-size: 11px; font-weight: 700; }

    /* Kugghjulet blir kvar, annars går det inte att ta sig ur läget */
    #settings-button {
      top: 3px; right: 3px;
      width: 22px; height: 22px;
      font-size: 11px;
      opacity: 0.35;
    }
    #settings-button:hover, #settings-button:focus-visible { opacity: 1; }

    #digital-clock,
    #app.mode-digital #digital-clock { font-size: min(15vw, 38vmin); }
    #app.mode-analog #clock-wrap { width: min(96vmin, 96vw); height: min(96vmin, 96vw); }

    /* Smalare kort — varje sparad tiondels em är en större siffra */
    .flip-sizer { padding: 0 0.1em; min-width: 0.55em; }
    #digital-clock.style-flip { gap: 0.3vmin; }

    /* Panelerna måste ta hela rutan för att gå att använda alls */
    .overlay .panel {
      width: 100vw; max-width: 100vw;
      height: 100vh; max-height: 100vh;
      border-radius: 0; border: none;
      padding: 8px;
    }
    #settings-panel { gap: 6px; }
    #settings-panel h2 { font-size: 0.95rem; }
    #settings-panel h3 { margin: 0.2em 0 -0.4em; }
    #style-toast { font-size: 0.7rem; padding: 4px 10px; }
    #quote-panel, #qr-panel { justify-content: center; gap: 6px; }
    #qr-code { width: min(45vh, 45vw); }
  }

  /* Det ryms bara en klocka. Vilken som passar avgörs av rutans form:
     en bred och låg remsa utnyttjas bäst av siffror, en kvadratisk ruta av
     urtavlan — som annars lämnar all höjd oanvänd. Gränsen 8/5 ligger mellan
     de format det handlar om. */
  @media (max-height: 300px) and (min-aspect-ratio: 8/5) {
    #app.mode-both #clock-wrap { display: none; }
  }

  @media (max-height: 300px) and (max-aspect-ratio: 8/5) {
    #app.mode-both #digital-wrap { display: none; }
    #app.mode-both #clock-wrap {
      display: block;
      width: min(96vmin, 96vw);
      height: min(96vmin, 96vw);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    html, body, #style-toast, .style-dots .dot { transition: none; }
    .flip-card.is-flipping .flip-leaf,
    .flip-card.is-flipping .flip-leaf::after,
    #clock .hand-second.is-sweeping { animation: none; }
    /* Varningen ska synas även här, men som en lugn toning i stället för pulser */
    #page-flash.is-flashing { animation-duration: 2.5s; animation-iteration-count: 1; }
  }
</style>
</head>
<body>
<noscript>
  <p class="noscript-message">Klockan kräver JavaScript. Aktivera JavaScript i webbläsaren och ladda om sidan.</p>
</noscript>

<canvas id="effects-canvas" aria-hidden="true"></canvas>

<div id="app">
  <div id="digital-wrap">
    <div id="digital-clock" role="timer" aria-label="Digital klocka"></div>
    <div class="style-dots" id="digital-dots" aria-hidden="true"></div>
  </div>

  <div id="clock-wrap">
    <svg id="clock" viewBox="0 0 200 200" role="img" aria-label="Analog klocka"></svg>
  </div>
  <div class="style-dots" id="clock-dots" aria-hidden="true"></div>

  <div id="names">
    <span id="primary-name"></span>
    <span id="name-separator" class="separator is-hidden">&amp;</span>
    <span id="secondary-name"></span>
  </div>
</div>

<div id="page-flash" aria-hidden="true"></div>
<div id="style-toast" role="status" aria-live="polite"></div>

<button id="fullscreen-button" type="button" title="Helskärm" aria-label="Växla helskärm">⛶</button>
<button id="settings-button" type="button" title="Inställningar" aria-label="Öppna inställningar">⚙️</button>
<button id="qr-button" type="button" title="Visdomsord" aria-label="Visa QR-kod för visdomsord">🔳</button>
<div id="wake-warning" role="status"></div>

<div id="break-timer" class="is-hidden" aria-label="Nedräkning till nästa rast">
  <div id="break-label"></div>
  <div id="break-countdown"></div>
</div>

<div class="overlay is-hidden" id="settings-overlay" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="panel" id="settings-panel">
    <h2 id="settings-title">Inställningar</h2>

    <h3>Tema</h3>
    <label>Tema <select id="theme-select"></select></label>
    <p class="field-hint">Tips: svep på urtavlan för att byta tema, och på digitalklockan för att byta stil.</p>
    <label class="checkbox-row"><input type="checkbox" id="custom-colors-toggle" /> Använd egna färger i stället för temats</label>
    <div class="color-row is-hidden" id="custom-colors-row">
      <label>Bakgrundsfärg <input type="color" id="background-color-input" /></label>
      <label>Förgrundsfärg <input type="color" id="foreground-color-input" /></label>
    </div>

    <h3>Namn</h3>
    <label>Namn 1 <input type="text" id="primary-name-input" maxlength="24" placeholder="t.ex. Anna" /></label>
    <label>Namn 2 (valfritt) <input type="text" id="secondary-name-input" maxlength="24" placeholder="t.ex. Erik" /></label>
    <label>Typsnitt för namnen <select id="name-font-select"></select></label>
    <label>Monogram (Deco-tavlan, tomt ger vapenskölden) <input type="text" id="monogram-input" maxlength="3" placeholder="t.ex. RB" /></label>

    <h3>Visning</h3>
    <label>Visa
      <select id="display-mode-select">
        <option value="both">Analog och digital</option>
        <option value="analog">Bara analog</option>
        <option value="digital">Bara digital</option>
      </select>
    </label>
    <label>Digitalklockans stil <select id="digital-style-select"></select></label>
    <label class="checkbox-row"><input type="checkbox" id="flip-clack-toggle" /> Ljud när flipbladen slår i</label>
    <label class="checkbox-row">
      <input type="checkbox" id="same-font-toggle" /> Samma typsnitt för namn och digitalklocka
    </label>
    <label id="clock-font-row">Typsnitt för digitalklockan <select id="clock-font-select"></select></label>

    <h3>Raster</h3>
    <div class="time-row">
      <label>Frukost <input type="time" id="breakfast-time-input" /></label>
      <label>Lunch <input type="time" id="lunch-time-input" /></label>
      <label>Fika <input type="time" id="coffee-break-time-input" /></label>
    </div>
    <label class="checkbox-row"><input type="checkbox" id="break-countdown-toggle" /> Visa nedräkning till nästa rast</label>
    <label class="checkbox-row"><input type="checkbox" id="break-chime-toggle" /> Spela ljud när en rast börjar</label>

    <h3>Arbetsdagens slut</h3>
    <label>Dags att gå hem <input type="time" id="home-time-input" /></label>
    <label class="checkbox-row"><input type="checkbox" id="home-alert-toggle" /> Varna tydligt och blinka hela sidan</label>

    <h3>Övrigt</h3>
    <label class="checkbox-row"><input type="checkbox" id="seasonal-effects-toggle" /> Visa säsongseffekter (snö, konfetti m.m.)</label>
    <label>Extra fest-dag (valfritt, format MM-DD)
      <input type="text" id="celebration-date-input" placeholder="t.ex. 04-12" maxlength="5" inputmode="numeric" />
    </label>
    <p class="field-error is-hidden" id="celebration-date-error">Ange datumet som MM-DD, till exempel 04-12.</p>

    <button class="primary-button" type="button" id="settings-close">Klar</button>
  </div>
</div>

<div class="overlay is-hidden" id="keyboard-overlay" role="dialog" aria-modal="true" aria-label="Skärmtangentbord">
  <div class="panel" id="keyboard-panel">
    <div id="keyboard-display" aria-live="polite"></div>
    <div class="keyboard-row" id="keyboard-row-1"></div>
    <div class="keyboard-row" id="keyboard-row-2"></div>
    <div class="keyboard-row" id="keyboard-row-3"></div>
    <div class="keyboard-row">
      <button class="keyboard-key is-wide" type="button" id="keyboard-space">mellanslag</button>
      <button class="keyboard-key" type="button" id="keyboard-backspace" aria-label="Radera tecken">⌫</button>
      <button class="keyboard-key is-close" type="button" id="keyboard-close">Stäng</button>
    </div>
  </div>
</div>

<div class="overlay is-hidden" id="quote-overlay" role="dialog" aria-modal="true" aria-labelledby="quote-title">
  <div class="panel" id="quote-panel">
    <h2 id="quote-title">Ett visdomsord</h2>
    <div id="quote-text"></div>
    <div id="quote-author"></div>
    <button class="primary-button" type="button" id="quote-close">Stäng</button>
  </div>
</div>

<div class="overlay is-hidden" id="qr-overlay" role="dialog" aria-modal="true" aria-labelledby="qr-title">
  <div class="panel" id="qr-panel">
    <h2 id="qr-title">Skanna för ett visdomsord</h2>
    <svg id="qr-code" role="img" aria-label="QR-kod till visdomsord"></svg>
    <div id="qr-hint">Rikta en annan enhets kamera mot koden</div>
    <div id="qr-error" class="is-hidden"></div>
    <button class="primary-button" type="button" id="qr-close">Stäng</button>
  </div>
</div>

<script type="module">

  const element = document.getElementById(elementId);
  // Fail fast: saknad nod betyder att HTML och JS glidit isär vid en ändring
  if (element === null) throw new Error(`Saknar element med id "${elementId}"`);
  return element;
}

  { elementId: "home-time-input", settingKey: "homeTime", property: "value" },
  { elementId: "home-alert-toggle", settingKey: "alertAtHomeTime", property: "checked" },
  { elementId: "seasonal-effects-toggle", settingKey: "seasonalEffectsEnabled", property: "checked" },
  { elementId: "celebration-date-input", settingKey: "celebrationDate", property: "value" }
]);

const settingElements = new Map(
  SETTING_BINDINGS.map((binding) => [binding.elementId, requireElement(binding.elementId)])
);

function migrateVersionOneKeys(candidate) {
  const migrated = { ...candidate };
  for (const [legacyKey, currentKey] of Object.entries(LEGACY_KEY_MAP)) {
    if (!(legacyKey in migrated)) continue;
    if (migrated[currentKey] === undefined) migrated[currentKey] = migrated[legacyKey];
    delete migrated[legacyKey];
  }
  return migrated;
}

function migrateVersionTwoStyles(candidate) {
  const migrated = { ...candidate };

  if (migrated.themeId === undefined) {
    migrated.themeId = LEGACY_CLOCK_STYLE_TO_THEME[migrated.clockStyleId] ?? DEFAULT_SETTINGS.themeId;
  }

  /* Hade användaren ändrat färgerna i version 2 ska de behållas — annars
     tar det nya temats palett över. */
  if (migrated.useCustomColors === undefined) {
    const hasCustomBackground =
      migrated.backgroundColor !== undefined && migrated.backgroundColor !== VERSION_2_DEFAULT_BACKGROUND;
    const hasCustomForeground =
      migrated.foregroundColor !== undefined && migrated.foregroundColor !== VERSION_2_DEFAULT_FOREGROUND;
    migrated.useCustomColors = hasCustomBackground || hasCustomForeground;
  }

  delete migrated.clockStyleId;
  return migrated;
}

function migrateSettings(storedSettings) {
  // Version 1 saknade versionsfält helt, därför standardvärdet
  const storedVersion = Number(storedSettings.version) || INITIAL_SETTINGS_VERSION;
  let migrated = { ...storedSettings };

  if (storedVersion < 2) migrated = migrateVersionOneKeys(migrated);
  if (storedVersion < 3) migrated = migrateVersionTwoStyles(migrated);

  migrated.version = SETTINGS_VERSION;
  return migrated;
}

function pickValidId(candidateId, options, fallbackId) {
  return options.some((option) => option.id === candidateId) ? candidateId : fallbackId;
}

/* Formatkontroll räcker inte: "25:99" har rätt form men ger ett orimligt
   datum när det skickas vidare till Date.setHours(). */
function isValidTimeString(candidate) {
  if (typeof candidate !== "string") return false;
  const match = TIME_OF_DAY_PATTERN.exec(candidate);
  if (match === null) return false;
  return Number(match[1]) < HOURS_PER_DAY && Number(match[2]) < MINUTES_PER_HOUR;
}

function isValidCelebrationDate(candidate) {
  const match = CELEBRATION_DATE_PATTERN.exec(candidate);
  if (match === null) return false;
  const month = Number(match[1]);
  const day = Number(match[2]);
  return month >= MONTH_JANUARY && month <= MONTH_DECEMBER && day >= 1 && day <= MAX_DAY_IN_MONTH;
}

/* localStorage är extern data — allt som läses därifrån måste valideras. */
function sanitizeSettings(candidate) {
  const clean = { ...DEFAULT_SETTINGS, ...candidate, version: SETTINGS_VERSION };

  clean.themeId = pickValidId(clean.themeId, THEMES, DEFAULT_SETTINGS.themeId);
  clean.digitalStyleId = pickValidId(clean.digitalStyleId, DIGITAL_STYLES, DEFAULT_SETTINGS.digitalStyleId);
  clean.nameFontId = pickValidId(clean.nameFontId, FONT_OPTIONS, DEFAULT_SETTINGS.nameFontId);
  clean.clockFontId = pickValidId(clean.clockFontId, FONT_OPTIONS, DEFAULT_SETTINGS.clockFontId);

  if (!HEX_COLOR_PATTERN.test(String(clean.backgroundColor))) clean.backgroundColor = DEFAULT_SETTINGS.backgroundColor;
  if (!HEX_COLOR_PATTERN.test(String(clean.foregroundColor))) clean.foregroundColor = DEFAULT_SETTINGS.foregroundColor;

  clean.primaryName = String(clean.primaryName ?? "").slice(0, NAME_MAX_LENGTH);
  clean.secondaryName = String(clean.secondaryName ?? "").slice(0, NAME_MAX_LENGTH);
  clean.monogramText = String(clean.monogramText ?? "").trim().slice(0, MONOGRAM_MAX_LENGTH);

  if (!DISPLAY_MODES.includes(clean.displayMode)) clean.displayMode = DEFAULT_SETTINGS.displayMode;

  if (!isValidTimeString(clean.breakfastTime)) clean.breakfastTime = DEFAULT_SETTINGS.breakfastTime;
  if (!isValidTimeString(clean.lunchTime)) clean.lunchTime = DEFAULT_SETTINGS.lunchTime;
  if (!isValidTimeString(clean.coffeeBreakTime)) clean.coffeeBreakTime = DEFAULT_SETTINGS.coffeeBreakTime;
  if (!isValidTimeString(clean.homeTime)) clean.homeTime = DEFAULT_SETTINGS.homeTime;

  clean.useCustomColors = Boolean(clean.useCustomColors);
  clean.useSameFontForClock = Boolean(clean.useSameFontForClock);
  clean.showBreakCountdown = Boolean(clean.showBreakCountdown);
  clean.playBreakChime = Boolean(clean.playBreakChime);
  clean.playFlipClack = Boolean(clean.playFlipClack);
  clean.alertAtHomeTime = Boolean(clean.alertAtHomeTime);
  clean.seasonalEffectsEnabled = Boolean(clean.seasonalEffectsEnabled);

  const celebrationDate = String(clean.celebrationDate ?? "").trim();
  clean.celebrationDate = isValidCelebrationDate(celebrationDate) ? celebrationDate : "";

  return clean;
}

function loadSettings() {
  try {
    const rawValue = localStorage.getItem(STORAGE_KEY);
    if (rawValue === null) return { ...DEFAULT_SETTINGS };
    return sanitizeSettings(migrateSettings(JSON.parse(rawValue)));
  } catch (error) {
    /* Lagringen kan vara avstängd eller otillgänglig. Appen faller tillbaka på
       standardvärden och fungerar vidare — det är ingen felsituation. */
    console.warn("Sparade inställningar kunde inte läsas, använder standardvärden:", error);
    return { ...DEFAULT_SETTINGS };
  }
}

function saveSettings(settingsToSave) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(settingsToSave));
  } catch (error) {
    console.warn("Inställningarna kunde inte sparas:", error);
  }
}

let settings = loadSettings();
// Skriv tillbaka direkt så att migrerade nycklar inte migreras om vid varje start
saveSettings(settings);

function getActiveTheme() {
  return THEMES.find((theme) => theme.id === settings.themeId) ?? THEMES[0];
}

function readCssVariable(variableName) {
  return getComputedStyle(document.documentElement).getPropertyValue(variableName).trim();
}


/* ==========================================================================
   6. TILLÄMPA INSTÄLLNINGAR
   ========================================================================== */

function getMonogramText() {
  if (settings.monogramText) return settings.monogramText.toUpperCase();

  const firstName = settings.primaryName.trim();
  const secondName = settings.secondaryName.trim();
  if (firstName && secondName) return (firstName[0] + secondName[0]).toUpperCase();
  if (firstName) return firstName.slice(0, 2).toUpperCase();
  return MONOGRAM_FALLBACK_SYMBOL;
}

function findFontFamily(fontId) {
  const fontDefinition = FONT_OPTIONS.find((option) => option.id === fontId);
  return (fontDefinition ?? FONT_OPTIONS[0]).family;
}

function applyNames() {
  const firstName = settings.primaryName.trim();
  const secondName = settings.secondaryName.trim();
  const hasBothNames = Boolean(firstName && secondName);

  dom.primaryName.textContent = hasBothNames ? firstName : (firstName || secondName);
  dom.secondaryName.textContent = hasBothNames ? secondName : "";
  dom.nameSeparator.classList.toggle(CLASS_HIDDEN, !hasBothNames);
}

function applyPalette() {
  const rootStyle = document.documentElement.style;
  // CSS behöver samma mått som urtavlan ritas med — JS är enda källan
  rootStyle.setProperty(CSS_VARIABLE_DIAL_CENTER, `${DIAL_CENTER}px`);
  rootStyle.setProperty(CSS_VARIABLE_SWEEP_CYCLE, `${SWEEP_CYCLE_SECONDS}s`);
  document.documentElement.setAttribute(THEME_ATTRIBUTE, settings.themeId);

  /* Inline-variabler vinner över temablocket i CSS, vilket är precis vad
     "egna färger" ska göra. Utan valet tas de bort helt. */
  if (settings.useCustomColors) {
    rootStyle.setProperty(CSS_VARIABLE_BACKGROUND, settings.backgroundColor);
    rootStyle.setProperty(CSS_VARIABLE_FOREGROUND, settings.foregroundColor);
  } else {
    rootStyle.removeProperty(CSS_VARIABLE_BACKGROUND);
    rootStyle.removeProperty(CSS_VARIABLE_FOREGROUND);
  }

  // Håller statusfältet i systemets PWA-skal i takt med temat
  if (dom.themeColorMeta !== null) {
    dom.themeColorMeta.setAttribute("content", readCssVariable(CSS_VARIABLE_BACKGROUND));
  }
}

function applyTypography() {
  // Tom sträng återlämnar kontrollen till temats CSS-variabel
  dom.names.style.fontFamily = findFontFamily(settings.nameFontId);

  /* Typsnittet gäller båda digitalstilarna. Tidigare ignorerades valet helt i
     flip-läget, vilket gav en kontroll som såg klickbar ut men inte gjorde
     något. Alternativet "Följ temat" ger tom sträng och lämnar tillbaka
     styrningen till temats CSS-variabel. */
  const clockFontId = settings.useSameFontForClock ? settings.nameFontId : settings.clockFontId;
  dom.digitalClock.style.fontFamily = findFontFamily(clockFontId);
}

function applySettings() {
  applyPalette();
  applyNames();
  applyTypography();

  dom.breakTimer.classList.toggle(CLASS_HIDDEN, !settings.showBreakCountdown);

  DISPLAY_MODES.forEach((mode) => dom.app.classList.remove(`mode-${mode}`));
  dom.app.classList.add(`mode-${settings.displayMode}`);

  DIGITAL_STYLES.forEach((style) => dom.digitalClock.classList.remove(`style-${style.id}`));
  dom.digitalClock.classList.add(`style-${settings.digitalStyleId}`);

  buildClockFace(getActiveTheme().dial);
  buildDigitalClockStructure();
  renderStyleDots();
  refreshSeasonalEffect();
  renderCurrentTime();
}


/* ==========================================================================
   7. ANALOG KLOCKA
   Visarna ligger i en <g> som är flyttad till mitten, så formernas koordinater
   utgår från 0,0 och rotationen blir en ren rotate() utan mittpunkt.
   ========================================================================== */

const SVG_NAMESPACE = "http://www.w3.org/2000/svg";
const handElements = { hour: null, minute: null, second: null };

function createSvgElement(tagName, attributes) {
  const element = document.createElementNS(SVG_NAMESPACE, tagName);
  for (const [attributeName, attributeValue] of Object.entries(attributes)) {
    element.setAttribute(attributeName, String(attributeValue));
  }
  return element;
}

function polarPoint(radius, angleDegrees) {
  // -90° flyttar nollpunkten från "klockan 3" till "klockan 12"
  const angleRadians = ((angleDegrees - 90) * Math.PI) / 180;
  return {
    x: DIAL_CENTER + radius * Math.cos(angleRadians),
    y: DIAL_CENTER + radius * Math.sin(angleRadians)
  };
}

function shouldDrawHourTick(tickIndex, hourTicksMode) {
  const tickDivisor = hourTicksMode === HOUR_TICKS_QUARTERS ? TICKS_PER_QUARTER_MARK : TICKS_PER_HOUR_MARK;
  return tickIndex % tickDivisor === 0;
}

function appendDialTicks(dialConfig) {
  for (let tickIndex = 0; tickIndex < TICK_COUNT; tickIndex += 1) {
    const drawAsHourTick = shouldDrawHourTick(tickIndex, dialConfig.hourTicks);
    if (!drawAsHourTick && !dialConfig.showMinuteTicks) continue;

    const angleDegrees = tickIndex * DEGREES_PER_TICK;
    const outerPoint = polarPoint(DIAL_RADIUS - TICK_OUTER_INSET, angleDegrees);
    const tickLength = drawAsHourTick ? TICK_LENGTH_HOUR : TICK_LENGTH_MINUTE;
    const innerPoint = polarPoint(DIAL_RADIUS - TICK_OUTER_INSET - tickLength, angleDegrees);

    dom.clockSvg.appendChild(createSvgElement("line", {
      class: drawAsHourTick ? "tick-hour" : "tick-minute",
      "stroke-width": drawAsHourTick ? TICK_STROKE_HOUR : TICK_STROKE_MINUTE,
      x1: outerPoint.x, y1: outerPoint.y, x2: innerPoint.x, y2: innerPoint.y
    }));
  }
}

function appendDialNumbers(numeralsMode) {
  if (numeralsMode === NUMERALS_NONE) return;

  const hourNumbers = numeralsMode === NUMERALS_QUARTERS
    ? QUARTER_HOURS
    : Array.from({ length: HOURS_ON_DIAL }, (unused, index) => index + 1);

  hourNumbers.forEach((hourNumber) => {
    const position = polarPoint(DIAL_RADIUS - NUMBER_RADIUS_INSET, hourNumber * DEGREES_PER_HOUR_STEP);
    const numberElement = createSvgElement("text", {
      class: "number",
      x: position.x,
      y: position.y + NUMBER_BASELINE_OFFSET,
      "text-anchor": "middle",
      "font-size": NUMBER_FONT_SIZE
    });
    numberElement.textContent = String(hourNumber);
    dom.clockSvg.appendChild(numberElement);
  });
}

function appendOrnament(ornamentName) {
  if (ornamentName === ORNAMENT_CHAPTER_RING) {
    dom.clockSvg.appendChild(createSvgElement("circle", {
      class: "chapter-ring",
      cx: DIAL_CENTER, cy: DIAL_CENTER,
      r: DIAL_RADIUS - CHAPTER_RING_INSET,
      "stroke-width": CHAPTER_RING_STROKE_WIDTH
    }));
    return;
  }

  if (ornamentName !== ORNAMENT_SUNBURST) return;

  const degreesPerRay = FULL_TURN_DEGREES / SUNBURST_RAY_COUNT;
  for (let rayIndex = 0; rayIndex < SUNBURST_RAY_COUNT; rayIndex += 1) {
    const angleDegrees = rayIndex * degreesPerRay;
    const innerPoint = polarPoint(SUNBURST_INNER_RADIUS, angleDegrees);
    const outerPoint = polarPoint(DIAL_RADIUS - SUNBURST_OUTER_INSET, angleDegrees);
    dom.clockSvg.appendChild(createSvgElement("line", {
      class: "sunburst-ray",
      "stroke-width": SUNBURST_STROKE_WIDTH,
      x1: innerPoint.x, y1: innerPoint.y, x2: outerPoint.x, y2: outerPoint.y
    }));
  }
}

/* Tomt monogramfält ger vapenskölden. Skriver användaren in något visas den
   texten i stället — båda varianterna finns kvar. */
function appendMonogram() {
  const monogramText = settings.monogramText.trim();

  if (monogramText === "") {
    dom.clockSvg.appendChild(createSvgElement("image", {
      href: DIAL_CREST_IMAGE_PATH,
      x: DIAL_CENTER - DIAL_CREST_WIDTH / 2,
      y: DIAL_CENTER + MONOGRAM_CENTER_OFFSET_Y - DIAL_CREST_HEIGHT / 2,
      width: DIAL_CREST_WIDTH,
      height: DIAL_CREST_HEIGHT,
      opacity: DIAL_CREST_OPACITY
    }));
    return;
  }

  dom.clockSvg.appendChild(createSvgElement("circle", {
    class: "monogram-ring",
    cx: DIAL_CENTER,
    cy: DIAL_CENTER + MONOGRAM_CENTER_OFFSET_Y,
    r: MONOGRAM_RING_RADIUS,
    "stroke-width": MONOGRAM_RING_STROKE_WIDTH
  }));

  const monogramElement = createSvgElement("text", {
    class: "monogram",
    x: DIAL_CENTER,
    y: DIAL_CENTER + MONOGRAM_BASELINE_OFFSET_Y,
    "text-anchor": "middle",
    "font-size": MONOGRAM_FONT_SIZE
  });
  monogramElement.textContent = getMonogramText();
  dom.clockSvg.appendChild(monogramElement);
}

function createHandShape(shapeName, handLength, handWidth, tailLength, strokeWidth) {
  // Raka visare utgår från navet och saknar svans
  if (shapeName === HAND_SHAPE_LINE) {
    return createSvgElement("line", { x1: 0, y1: 0, x2: 0, y2: -handLength, "stroke-width": strokeWidth });
  }

  if (shapeName === HAND_SHAPE_HAIRLINE) {
    return createSvgElement("line", {
      x1: 0, y1: tailLength, x2: 0, y2: -handLength, "stroke-width": strokeWidth
    });
  }

  if (shapeName === HAND_SHAPE_BAR) {
    return createSvgElement("rect", {
      x: -handWidth / 2, y: -handLength, width: handWidth, height: handLength + tailLength
    });
  }

  if (shapeName === HAND_SHAPE_LOZENGE) {
    const waistY = -handLength * LOZENGE_WAIST_RATIO;
    const waistHalfWidth = handWidth * LOZENGE_WIDTH_RATIO;
    return createSvgElement("polygon", {
      points: `0,${-handLength} ${waistHalfWidth},${waistY} 0,${tailLength} ${-waistHalfWidth},${waistY}`
    });
  }

  // Baton: bred vid navet, avsmalnande mot spetsen
  const tipHalfWidth = handWidth * HAND_TIP_TAPER_RATIO;
  return createSvgElement("polygon", {
    points: `${-handWidth / 2},${tailLength} ${handWidth / 2},${tailLength} ` +
            `${tipHalfWidth},${-handLength} ${-tipHalfWidth},${-handLength}`
  });
}

function appendHandGroup(role, shapeElements) {
  const group = createSvgElement("g", {
    class: `hand hand-${role}`,
    transform: `translate(${DIAL_CENTER} ${DIAL_CENTER})`
  });
  shapeElements.forEach((shapeElement) => group.appendChild(shapeElement));
  dom.clockSvg.appendChild(group);
  return group;
}

function createSecondHandShapes(secondHandStyle) {
  if (secondHandStyle === SECOND_HAND_NONE) return [];

  if (secondHandStyle === SECOND_HAND_LOLLIPOP) {
    return [
      createSvgElement("line", {
        x1: 0, y1: SECOND_HAND_COUNTERWEIGHT_OFFSET, x2: 0, y2: -HAND_LENGTH_SECOND,
        "stroke-width": SECOND_HAND_STROKE_WIDTH * 2
      }),
      createSvgElement("circle", {
        cx: 0, cy: -HAND_LENGTH_SECOND * SECOND_HAND_LOLLIPOP_RATIO, r: SECOND_HAND_LOLLIPOP_RADIUS
      })
    ];
  }

  if (secondHandStyle === SECOND_HAND_COUNTERWEIGHT) {
    return [
      createSvgElement("line", {
        x1: 0, y1: SECOND_HAND_TAIL_WEIGHTED, x2: 0, y2: -HAND_LENGTH_SECOND,
        "stroke-width": SECOND_HAND_STROKE_WIDTH
      }),
      createSvgElement("circle", {
        cx: 0, cy: SECOND_HAND_COUNTERWEIGHT_OFFSET, r: SECOND_HAND_COUNTERWEIGHT_RADIUS
      })
    ];
  }

  return [createSvgElement("line", {
    x1: 0, y1: SECOND_HAND_TAIL_PLAIN, x2: 0, y2: -HAND_LENGTH_SECOND,
    "stroke-width": SECOND_HAND_STROKE_WIDTH
  })];
}

function appendHub(hubStyle) {
  if (hubStyle === HUB_NONE) return;

  if (hubStyle === HUB_RING) {
    dom.clockSvg.appendChild(createSvgElement("circle", {
      class: "hub-outer", cx: DIAL_CENTER, cy: DIAL_CENTER, r: HUB_OUTER_RADIUS
    }));
    dom.clockSvg.appendChild(createSvgElement("circle", {
      class: "hub-inner", cx: DIAL_CENTER, cy: DIAL_CENTER, r: HUB_INNER_RADIUS
    }));
    return;
  }

  dom.clockSvg.appendChild(createSvgElement("circle", {
    class: "hub-outer", cx: DIAL_CENTER, cy: DIAL_CENTER, r: HUB_DOT_RADIUS
  }));
}

function buildClockFace(dialConfig) {
  dom.clockSvg.replaceChildren();

  if (dialConfig.showRim) {
    dom.clockSvg.appendChild(createSvgElement("circle", {
      class: "rim", cx: DIAL_CENTER, cy: DIAL_CENTER, r: DIAL_RADIUS, "stroke-width": RIM_STROKE_WIDTH
    }));
  }

  appendOrnament(dialConfig.ornament);
  appendDialTicks(dialConfig);
  appendDialNumbers(dialConfig.numerals);
  if (dialConfig.showMonogram) appendMonogram();

  handElements.hour = appendHandGroup("hour", [createHandShape(
    dialConfig.handShape, HAND_LENGTH_HOUR, HAND_WIDTH_HOUR, HAND_TAIL_HOUR,
    dialConfig.handStrokeHour ?? HAIRLINE_STROKE_HOUR
  )]);
  handElements.minute = appendHandGroup("minute", [createHandShape(
    dialConfig.handShape, HAND_LENGTH_MINUTE, HAND_WIDTH_MINUTE, HAND_TAIL_MINUTE,
    dialConfig.handStrokeMinute ?? HAIRLINE_STROKE_MINUTE
  )]);
  handElements.second = appendHandGroup("second", createSecondHandShapes(dialConfig.secondHand));
  if (dialConfig.secondMotion === SECOND_MOTION_SWEEP && !prefersReducedMotion.matches) {
    handElements.second.classList.add(CLASS_SWEEPING);
    syncSweepPhase(new Date());
  }

  appendHub(dialConfig.hub);
}

/* Animationen är låst till väggklockan genom en negativ fördröjning: den
   startar mitt i sitt varv, på exakt den sekund minuten faktiskt är på. */
function syncSweepPhase(now) {
  const secondHand = handElements.second;
  if (secondHand === null || !secondHand.classList.contains(CLASS_SWEEPING)) return;

  const secondsIntoCycle = (now.getSeconds() + now.getMilliseconds() / MILLISECONDS_PER_SECOND)
    % SWEEP_CYCLE_SECONDS;
  secondHand.style.animationDelay = `${-secondsIntoCycle}s`;
}

function rotateHand(handGroup, angleDegrees) {
  handGroup.setAttribute("transform", `translate(${DIAL_CENTER} ${DIAL_CENTER}) rotate(${angleDegrees})`);
}

function updateAnalogHands(now) {
  if (settings.displayMode === "digital") return;

  const hours = now.getHours() % HOURS_ON_DIAL;
  const minutes = now.getMinutes();
  const seconds = now.getSeconds();

  const dialConfig = getActiveTheme().dial;

  rotateHand(handElements.hour, hours * DEGREES_PER_HOUR_STEP + minutes * HOUR_HAND_DEGREES_PER_MINUTE);

  /* Stationsklockans minutvisare drivs av en puls och står stilla mellan
     minuterna, i stället för att krypa fram sekund för sekund. */
  const minuteAngle = dialConfig.minuteHandJumps
    ? minutes * DEGREES_PER_MINUTE_STEP
    : minutes * DEGREES_PER_MINUTE_STEP + seconds * MINUTE_HAND_DEGREES_PER_SECOND;
  rotateHand(handElements.minute, minuteAngle);

  // Sveper visaren sköts rörelsen av CSS; att sätta transform här skulle bryta den
  if (!handElements.second.classList.contains(CLASS_SWEEPING)) {
    rotateHand(handElements.second, seconds * DEGREES_PER_SECOND_STEP);
  }
}


/* ==========================================================================
   8. DIGITAL KLOCKA
   ========================================================================== */

/* Ett kort per siffra, inte per par. En äkta fallbladstavla har ett blad per
   tecken — och då viker bara den siffra som faktiskt ändras. */
const flipCards = [];
let lastRenderedTimeText = "";

function padTwoDigits(value) {
  return String(value).padStart(2, "0");
}

function createFlipLayer(className, text) {
  const layer = document.createElement("span");
  layer.className = className;
  layer.setAttribute("aria-hidden", "true");
  const face = document.createElement("span");
  face.textContent = text;
  layer.appendChild(face);
  return { layer, face };
}

/* Ett kort består av fyra lager, precis som en riktig fallbladstavla:
   två fasta halvor som ligger still och två blad som viker sig runt
   mittaxeln. Lagren byggs en gång och återanvänds sedan. */
function createFlipCard(initialText) {
  const card = document.createElement("span");
  card.className = "flip-card";

  const sizer = document.createElement("span");
  sizer.className = "flip-sizer";
  sizer.setAttribute("aria-hidden", "true");
  sizer.textContent = initialText;

  const staticTop = createFlipLayer("flip-half flip-half-top", initialText);
  const staticBottom = createFlipLayer("flip-half flip-half-bottom", initialText);
  const leafTop = createFlipLayer("flip-leaf flip-leaf-top", initialText);
  const leafBottom = createFlipLayer("flip-leaf flip-leaf-bottom", initialText);
  card.append(sizer, staticTop.layer, staticBottom.layer, leafTop.layer, leafBottom.layer);

  const cardState = {
    card, sizer,
    staticTop: staticTop.face, staticBottom: staticBottom.face,
    leafTop: leafTop.face, leafBottom: leafBottom.face,
    currentText: initialText
  };

  /* Den fasta nedre halvan får det nya värdet först när bladet landat,
     annars ser man siffran byta innan bladet hunnit täcka den. */
  card.addEventListener("animationend", (event) => {
    if (event.animationName !== FLIP_LEAF_LAND_ANIMATION) return;
    cardState.staticBottom.textContent = cardState.currentText;
    card.classList.remove(CLASS_FLIPPING);
  });

  return cardState;
}

function flipCardTo(cardState, nextText) {
  if (cardState.currentText === nextText) return false;
  const previousText = cardState.currentText;
  cardState.currentText = nextText;
  cardState.sizer.textContent = nextText;

  // Utan animation finns ingen animationend att vänta på — byt allt direkt
  if (prefersReducedMotion.matches) {
    cardState.staticTop.textContent = nextText;
    cardState.staticBottom.textContent = nextText;
    return false;
  }

  cardState.staticTop.textContent = nextText;        // avtäcks när bladet faller
  cardState.staticBottom.textContent = previousText; // ligger kvar tills bladet landar
  cardState.leafTop.textContent = previousText;
  cardState.leafBottom.textContent = nextText;

  // Layouten måste läsas om, annars startar animationen inte om nästa sekund
  cardState.card.classList.remove(CLASS_FLIPPING);
  void cardState.card.offsetWidth;
  cardState.card.classList.add(CLASS_FLIPPING);
  return true;
}

function isCompactLayout() {
  return readCssVariable(CSS_VARIABLE_COMPACT_LAYOUT) === COMPACT_LAYOUT_ENABLED;
}

/* I ett litet fönster tar bredden slut långt före höjden. Utan sekunderna
   blir det fyra kort i stället för sex, och varje siffra kan bli halvvägs
   större i stället för att klippas vid kanten. */
function getTimeSegments(date) {
  const segments = [padTwoDigits(date.getHours()), padTwoDigits(date.getMinutes())];
  if (!isCompactLayout()) segments.push(padTwoDigits(date.getSeconds()));
  return segments;
}

function buildDigitalClockStructure() {
  dom.digitalClock.replaceChildren();
  flipCards.length = 0;
  lastRenderedTimeText = "";
  if (settings.digitalStyleId !== "flip") return;

  // Startvärdet sätts till nuvarande tid så att korten inte viker sig i onödan
  const segments = getTimeSegments(new Date());
  segments.forEach((groupText, groupIndex) => {
    [...groupText].forEach((digit) => {
      const cardState = createFlipCard(digit);
      flipCards.push(cardState);
      dom.digitalClock.appendChild(cardState.card);
    });

    if (groupIndex < segments.length - 1) {
      const colonElement = document.createElement("span");
      colonElement.className = "flip-colon";
      colonElement.setAttribute("aria-hidden", "true");
      colonElement.textContent = ":";
      dom.digitalClock.appendChild(colonElement);
    }
  });
}

function renderDigitalClock(now) {
  if (settings.displayMode === "analog") return;

  const segments = getTimeSegments(now);
  const timeText = segments.join(":");
  if (timeText === lastRenderedTimeText) return;
  lastRenderedTimeText = timeText;

  // Lagren är dolda för skärmläsare; tiden läses upp från behållaren i stället
  dom.digitalClock.setAttribute("aria-label", `Klockan är ${timeText}`);

  if (settings.digitalStyleId === "flip") {
    /* Ett klack per tick, inte ett per kort. Flera identiska anslag samtidigt
       låter som ett trasigt eko i stället för en fallbladstavla. */
    const anyCardFlipped = [...segments.join("")]
      .map((digit, digitIndex) => flipCardTo(flipCards[digitIndex], digit))
      .some(Boolean);
    if (anyCardFlipped && settings.playFlipClack) playFlipClack();
    return;
  }
  dom.digitalClock.textContent = timeText;
}


/* ==========================================================================
   9. RASTNEDRÄKNING OCH LJUDSIGNAL
   ========================================================================== */

function atTimeOfDay(baseDate, hours, minutes) {
  const result = new Date(baseDate);
  result.setHours(hours, minutes, 0, 0);
  return result;
}

function parseTimeToday(timeText, baseDate) {
  const [hours, minutes] = timeText.split(":").map(Number);
  return atTimeOfDay(baseDate, hours, minutes);
}

function formatHoursMinutes(date) {
  return `${padTwoDigits(date.getHours())}:${padTwoDigits(date.getMinutes())}`;
}

function formatDuration(milliseconds) {
  const totalSeconds = Math.max(0, Math.floor(milliseconds / MILLISECONDS_PER_SECOND));
  const hours = Math.floor(totalSeconds / SECONDS_PER_HOUR);
  const minutes = Math.floor((totalSeconds % SECONDS_PER_HOUR) / SECONDS_PER_MINUTE);
  const seconds = totalSeconds % SECONDS_PER_MINUTE;
  return `${padTwoDigits(hours)}:${padTwoDigits(minutes)}:${padTwoDigits(seconds)}`;
}

/* Sorteras på klockslag så att rasterna kan ligga i vilken ordning som helst. */
function getBreakEvents(now) {
  return [
    { label: "Frukost", targetTime: parseTimeToday(settings.breakfastTime, now) },
    { label: "Lunch", targetTime: parseTimeToday(settings.lunchTime, now) },
    { label: "Fika", targetTime: parseTimeToday(settings.coffeeBreakTime, now) },
    { label: "Hemgång", targetTime: parseTimeToday(settings.homeTime, now), isEndOfDay: true }
  ].sort((first, second) => first.targetTime - second.targetTime);
}

function getBreakState(now) {
  const events = getBreakEvents(now);
  const upcomingEvent = events.find((event) => event.targetTime > now);
  if (upcomingEvent !== undefined) {
    return { hasUpcomingToday: true, label: upcomingEvent.label, targetTime: upcomingEvent.targetTime };
  }

  const tomorrowFirstBreak = new Date(events[0].targetTime);
  tomorrowFirstBreak.setDate(tomorrowFirstBreak.getDate() + 1);
  return { hasUpcomingToday: false, label: events[0].label, targetTime: tomorrowFirstBreak };
}

function updateBreakCountdown(now) {
  if (!settings.showBreakCountdown) return;

  const state = getBreakState(now);
  if (state.hasUpcomingToday) {
    dom.breakLabel.textContent = `Till ${state.label}`;
    dom.breakCountdown.textContent = formatDuration(state.targetTime - now);
    return;
  }
  dom.breakLabel.textContent = `Nästa: ${state.label}`;
  dom.breakCountdown.textContent = `imorgon ${formatHoursMinutes(state.targetTime)}`;
}

let audioContext = null;

function ensureAudioContext() {
  const AudioContextConstructor = window.AudioContext ?? window.webkitAudioContext;
  if (AudioContextConstructor === undefined) return;

  try {
    if (audioContext === null) audioContext = new AudioContextConstructor();
    if (audioContext.state === "suspended") audioContext.resume();
  } catch (error) {
    /* Ljud kan vara blockerat av webbläsaren eller sakna utgång. Rastsignalen
       uteblir då, men allt annat fungerar. */
    console.warn("Ljuduppspelning är inte tillgänglig:", error);
  }
}
// Webbläsare tillåter ljud först efter en användarinteraktion
document.addEventListener("pointerdown", ensureAudioContext, { once: true });

function playChime(chimeProfile) {
  if (audioContext === null) return;

  const startTime = audioContext.currentTime;
  chimeProfile.frequencies.forEach((frequencyHz, noteIndex) => {
    const noteStart = startTime + noteIndex * chimeProfile.spacingSeconds;
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = frequencyHz;
    gainNode.gain.setValueAtTime(CHIME_SILENT_GAIN, noteStart);
    gainNode.gain.exponentialRampToValueAtTime(chimeProfile.peakGain, noteStart + CHIME_ATTACK_S);
    gainNode.gain.exponentialRampToValueAtTime(CHIME_SILENT_GAIN, noteStart + CHIME_RELEASE_S);

    oscillator.connect(gainNode).connect(audioContext.destination);
    oscillator.start(noteStart);
    oscillator.stop(noteStart + CHIME_RELEASE_S + CHIME_STOP_PADDING_S);
  });
}

function flashPage() {
  // Layouten måste läsas om, annars startar animationen inte om nästa dag
  dom.pageFlash.classList.remove(CLASS_FLASHING);
  void dom.pageFlash.offsetWidth;
  dom.pageFlash.classList.add(CLASS_FLASHING);
}

dom.pageFlash.addEventListener("animationend", () => dom.pageFlash.classList.remove(CLASS_FLASHING));

/* Bruset byggs en gång och återanvänds — att skapa en ny buffert varje sekund
   vore rent slöseri på en klocka som går dygnet runt. */
let clackNoiseBuffer = null;

function getClackNoiseBuffer() {
  if (clackNoiseBuffer !== null) return clackNoiseBuffer;

  const frameCount = Math.floor(audioContext.sampleRate * CLACK_NOISE_DURATION_S);
  clackNoiseBuffer = audioContext.createBuffer(1, frameCount, audioContext.sampleRate);
  const samples = clackNoiseBuffer.getChannelData(0);
  for (let frame = 0; frame < frameCount; frame += 1) samples[frame] = Math.random() * 2 - 1;
  return clackNoiseBuffer;
}

/* Vikningens längd bor i CSS. Den läses därifrån i stället för att upprepas
   här, så att en ändrad hastighet automatiskt flyttar klacket med sig. */
function getFlipLeafDurationMs() {
  const rawValue = readCssVariable(CSS_VARIABLE_FLIP_LEAF_DURATION);
  const numericValue = Number.parseFloat(rawValue);
  if (!Number.isFinite(numericValue)) return FLIP_LEAF_DURATION_FALLBACK_MS;
  return rawValue.trim().endsWith("ms") ? numericValue : numericValue * MILLISECONDS_PER_UNIT_SECOND;
}

function playFlipClack() {
  if (audioContext === null) return;

  // Bladet landar först när båda halvorna vikt färdigt
  const startTime = audioContext.currentTime +
    (getFlipLeafDurationMs() * FLIP_LEAF_COUNT) / MILLISECONDS_PER_UNIT_SECOND;

  const noiseSource = audioContext.createBufferSource();
  noiseSource.buffer = getClackNoiseBuffer();
  const bandpass = audioContext.createBiquadFilter();
  bandpass.type = "bandpass";
  bandpass.frequency.value = CLACK_FILTER_FREQUENCY_HZ;
  bandpass.Q.value = CLACK_FILTER_Q;
  const noiseGain = audioContext.createGain();
  noiseGain.gain.setValueAtTime(CLACK_NOISE_GAIN, startTime);
  noiseGain.gain.exponentialRampToValueAtTime(CLACK_SILENT_GAIN, startTime + CLACK_NOISE_DECAY_S);
  noiseSource.connect(bandpass).connect(noiseGain).connect(audioContext.destination);
  noiseSource.start(startTime);
  noiseSource.stop(startTime + CLACK_NOISE_DURATION_S);

  const bodyOscillator = audioContext.createOscillator();
  bodyOscillator.type = "sine";
  bodyOscillator.frequency.value = CLACK_BODY_FREQUENCY_HZ;
  const bodyGain = audioContext.createGain();
  bodyGain.gain.setValueAtTime(CLACK_BODY_GAIN, startTime);
  bodyGain.gain.exponentialRampToValueAtTime(CLACK_SILENT_GAIN, startTime + CLACK_BODY_DECAY_S);
  bodyOscillator.connect(bodyGain).connect(audioContext.destination);
  bodyOscillator.start(startTime);
  bodyOscillator.stop(startTime + CLACK_BODY_DECAY_S);
}


/* Nyckel = rastens namn, värde = datumsträng. Ersätter det gamla
   2-sekundersfönstret, som missade rasten helt om appen låg i bakgrunden. */
const firedChimes = new Map();

function markPassedBreaksAsFired(now) {
  const todayText = now.toDateString();
  getBreakEvents(now).forEach((event) => {
    if (event.targetTime <= now) firedChimes.set(event.label, todayText);
  });
}

function checkBreakChime(now) {
  const todayText = now.toDateString();
  getBreakEvents(now).forEach((event) => {
    const elapsedMs = now - event.targetTime;
    if (elapsedMs < 0) return;
    if (firedChimes.get(event.label) === todayText) return;

    firedChimes.set(event.label, todayText);
    if (elapsedMs > BREAK_CHIME_MAX_LATE_MS) return;

    /* Hemgången har egen signal och blinkning, oberoende av rastljudet —
       den ska gå fram även för den som stängt av pling vid fika. */
    if (event.isEndOfDay) {
      if (!settings.alertAtHomeTime) return;
      playChime(HOME_CHIME);
      flashPage();
      return;
    }
    if (settings.playBreakChime) playChime(BREAK_CHIME);
  });
}


/* ==========================================================================
   10. HUVUDLOOP
   En enda självkorrigerande timer i stället för två setInterval som driftar.
   ========================================================================== */

let tickTimeoutId = null;

function renderCurrentTime() {
  const now = new Date();
  updateAnalogHands(now);
  renderDigitalClock(now);
  updateBreakCountdown(now);
}

function scheduleNextTick() {
  if (tickTimeoutId !== null) clearTimeout(tickTimeoutId);
  // Resten upp till nästa hela sekund, så att klockan inte driftar
  const millisecondsUntilNextSecond =
    MILLISECONDS_PER_SECOND - (Date.now() % MILLISECONDS_PER_SECOND);
  tickTimeoutId = setTimeout(runTick, millisecondsUntilNextSecond);
}

function runTick() {
  renderCurrentTime();
  checkBreakChime(new Date());
  scheduleNextTick();
}


/* ==========================================================================
   11. SÄSONGSEFFEKTER
   ========================================================================== */

const effectsContext = dom.effectsCanvas.getContext("2d");
const effectsViewport = { width: 0, height: 0 };
const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

let particles = [];
let activeEffect = null;
let animationFrameId = null;
let resizeTimeoutId = null;
let snowColor = SNOW_FALLBACK_COLOR;

function resizeEffectsCanvas() {
  if (effectsContext === null) return;

  // devicePixelRatio krävs för att partiklarna inte ska bli suddiga på plattan
  const pixelRatio = window.devicePixelRatio || 1;
  effectsViewport.width = window.innerWidth;
  effectsViewport.height = window.innerHeight;
  dom.effectsCanvas.width = Math.round(effectsViewport.width * pixelRatio);
  dom.effectsCanvas.height = Math.round(effectsViewport.height * pixelRatio);
  effectsContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
}

let wasCompactLayout = null;

/* Korsar fönstret brytpunkten måste korten byggas om — antalet ändras. */
function handleViewportResize() {
  resizeEffectsCanvas();
  const isCompact = isCompactLayout();
  if (isCompact === wasCompactLayout) return;
  wasCompactLayout = isCompact;
  buildDigitalClockStructure();
  renderCurrentTime();
}

window.addEventListener("resize", () => {
  if (resizeTimeoutId !== null) clearTimeout(resizeTimeoutId);
  resizeTimeoutId = setTimeout(handleViewportResize, RESIZE_DEBOUNCE_MS);
});
resizeEffectsCanvas();

function randomInRange(minimum, range) {
  return minimum + Math.random() * range;
}

function randomSymmetric(range) {
  return (Math.random() - 0.5) * range;
}

function createSnowParticle() {
  return {
    x: Math.random() * effectsViewport.width,
    y: Math.random() * effectsViewport.height,
    radius: randomInRange(SNOW_RADIUS_MIN_PX, SNOW_RADIUS_RANGE_PX),
    speedY: randomInRange(SNOW_FALL_SPEED_MIN, SNOW_FALL_SPEED_RANGE),
    speedX: randomSymmetric(SNOW_DRIFT_RANGE),
    opacity: randomInRange(SNOW_OPACITY_MIN, SNOW_OPACITY_RANGE)
  };
}

function createConfettiParticle() {
  return {
    x: Math.random() * effectsViewport.width,
    y: Math.random() * -effectsViewport.height,
    width: randomInRange(CONFETTI_WIDTH_MIN_PX, CONFETTI_WIDTH_RANGE_PX),
    height: randomInRange(CONFETTI_HEIGHT_MIN_PX, CONFETTI_HEIGHT_RANGE_PX),
    speedY: randomInRange(CONFETTI_FALL_SPEED_MIN, CONFETTI_FALL_SPEED_RANGE),
    speedX: randomSymmetric(CONFETTI_DRIFT_RANGE),
    rotation: Math.random() * FULL_TURN_DEGREES,
    rotationSpeed: randomSymmetric(CONFETTI_ROTATION_SPEED_RANGE),
    color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)]
  };
}

function initParticles(effectName) {
  particles = [];
  if (effectName === null) return;

  // Vit snö försvinner mot Station-temats ljusa botten — temat får bestämma
  snowColor = readCssVariable(CSS_VARIABLE_SNOW) || SNOW_FALLBACK_COLOR;

  const particleCount = effectName === EFFECT_SNOW ? SNOW_PARTICLE_COUNT : CONFETTI_PARTICLE_COUNT;
  const createParticle = effectName === EFFECT_SNOW ? createSnowParticle : createConfettiParticle;
  for (let particleIndex = 0; particleIndex < particleCount; particleIndex += 1) {
    particles.push(createParticle());
  }
}

function getSeasonalEffect(now) {
  if (!settings.seasonalEffectsEnabled || prefersReducedMotion.matches) return null;

  const month = now.getMonth() + 1;
  const day = now.getDate();

  const isNewYear = (month === MONTH_DECEMBER && day === NEW_YEARS_EVE_DAY) ||
                    (month === MONTH_JANUARY && day === NEW_YEARS_DAY);
  if (isNewYear) return EFFECT_CONFETTI;

  if (settings.celebrationDate) {
    const match = CELEBRATION_DATE_PATTERN.exec(settings.celebrationDate);
    if (match !== null && Number(match[1]) === month && Number(match[2]) === day) return EFFECT_CONFETTI;
  }

  const isSnowSeason = month === MONTH_DECEMBER ||
                       (month === MONTH_JANUARY && day <= LAST_SNOW_DAY_IN_JANUARY);
  return isSnowSeason ? EFFECT_SNOW : null;
}

function drawSnowParticle(particle) {
  particle.y += particle.speedY;
  particle.x += particle.speedX;
  if (particle.y > effectsViewport.height) {
    particle.y = -SNOW_RESPAWN_MARGIN_PX;
    particle.x = Math.random() * effectsViewport.width;
  }
  effectsContext.globalAlpha = particle.opacity;
  effectsContext.beginPath();
  effectsContext.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
  effectsContext.fillStyle = snowColor;
  effectsContext.fill();
  effectsContext.globalAlpha = 1;
}

function drawConfettiParticle(particle) {
  particle.y += particle.speedY;
  particle.x += particle.speedX;
  particle.rotation += particle.rotationSpeed;
  if (particle.y > effectsViewport.height + CONFETTI_RESPAWN_MARGIN_PX) {
    particle.y = -CONFETTI_RESPAWN_MARGIN_PX;
    particle.x = Math.random() * effectsViewport.width;
  }
  effectsContext.save();
  effectsContext.translate(particle.x, particle.y);
  effectsContext.rotate((particle.rotation * Math.PI) / 180);
  effectsContext.fillStyle = particle.color;
  effectsContext.fillRect(-particle.width / 2, -particle.height / 2, particle.width, particle.height);
  effectsContext.restore();
}

function renderEffectsFrame() {
  effectsContext.clearRect(0, 0, effectsViewport.width, effectsViewport.height);
  const drawParticle = activeEffect === EFFECT_SNOW ? drawSnowParticle : drawConfettiParticle;
  particles.forEach(drawParticle);
  animationFrameId = requestAnimationFrame(renderEffectsFrame);
}

/* Loopen stoppas helt när ingen effekt är aktiv. Tidigare målades hela
   skärmen om 60 gånger i sekunden året runt utan att något ritades. */
function startEffectsLoop() {
  if (effectsContext === null || animationFrameId !== null) return;
  animationFrameId = requestAnimationFrame(renderEffectsFrame);
}

function stopEffectsLoop() {
  if (animationFrameId !== null) {
    cancelAnimationFrame(animationFrameId);
    animationFrameId = null;
  }
  if (effectsContext !== null) {
    effectsContext.clearRect(0, 0, effectsViewport.width, effectsViewport.height);
  }
}

function refreshSeasonalEffect() {
  const nextEffect = getSeasonalEffect(new Date());
  if (nextEffect === activeEffect) return;

  activeEffect = nextEffect;
  initParticles(activeEffect);
  if (activeEffect === null) stopEffectsLoop();
  else startEffectsLoop();
}

setInterval(refreshSeasonalEffect, SEASONAL_CHECK_INTERVAL_MS);
// Äldre Safari saknar addEventListener på MediaQueryList; ett kast här hade
// stoppat resten av modulen från att köras
if (typeof prefersReducedMotion.addEventListener === "function") {
  prefersReducedMotion.addEventListener("change", refreshSeasonalEffect);
}


/* ==========================================================================
   12. KARUSELLER OCH PEKGESTER
   ========================================================================== */

function renderDotsInto(containerElement, styleList, activeStyleId) {
  containerElement.replaceChildren();
  styleList.forEach((style) => {
    const dotElement = document.createElement("div");
    dotElement.className = style.id === activeStyleId ? `dot ${CLASS_ACTIVE}` : "dot";
    containerElement.appendChild(dotElement);
  });
}

function renderStyleDots() {
  renderDotsInto(dom.clockDots, THEMES, settings.themeId);
  renderDotsInto(dom.digitalDots, DIGITAL_STYLES, settings.digitalStyleId);
}

let toastTimeoutId = null;

function showStyleToast(message) {
  dom.styleToast.textContent = message;
  dom.styleToast.classList.add(CLASS_VISIBLE);
  if (toastTimeoutId !== null) clearTimeout(toastTimeoutId);
  toastTimeoutId = setTimeout(() => dom.styleToast.classList.remove(CLASS_VISIBLE), STYLE_TOAST_DURATION_MS);
}

function cycleStyle(styleList, settingKey, direction) {
  const currentIndex = styleList.findIndex((style) => style.id === settings[settingKey]);
  const nextIndex = (currentIndex + direction + styleList.length) % styleList.length;
  const nextStyle = styleList[nextIndex];

  settings = { ...settings, [settingKey]: nextStyle.id };
  saveSettings(settings);
  applySettings();
  showStyleToast(nextStyle.label);
}

/* Skiljer tryck (påskägg) från svep (byt tema) på samma yta. */
function bindGestures(targetElement, { onTap, onSwipeLeft, onSwipeRight }) {
  let startX = 0;
  let startY = 0;
  let isTracking = false;

  targetElement.addEventListener("pointerdown", (event) => {
    startX = event.clientX;
    startY = event.clientY;
    isTracking = true;
  });

  targetElement.addEventListener("pointerup", (event) => {
    if (!isTracking) return;
    isTracking = false;

    const deltaX = event.clientX - startX;
    const deltaY = event.clientY - startY;

    if (Math.abs(deltaX) > SWIPE_MIN_DISTANCE_PX && Math.abs(deltaX) > Math.abs(deltaY)) {
      if (deltaX < 0) onSwipeLeft?.();
      else onSwipeRight?.();
      return;
    }
    if (Math.abs(deltaX) < TAP_MAX_MOVEMENT_PX && Math.abs(deltaY) < TAP_MAX_MOVEMENT_PX) onTap?.();
  });

  targetElement.addEventListener("pointercancel", () => { isTracking = false; });
}

let tapCount = 0;
let lastTapTimestamp = 0;

function handleClockTap() {
  const nowMs = Date.now();
  if (nowMs - lastTapTimestamp > TAP_SEQUENCE_RESET_MS) tapCount = 0;
  lastTapTimestamp = nowMs;
  tapCount += 1;

  if (tapCount < TAP_SEQUENCE_TARGET_COUNT) return;
  tapCount = 0;
  openKeyboard();
}

bindGestures(dom.clockWrap, {
  onTap: handleClockTap,
  onSwipeLeft: () => cycleStyle(THEMES, "themeId", 1),
  onSwipeRight: () => cycleStyle(THEMES, "themeId", -1)
});

// Påskägget måste nås även i läget "Bara digital", där urtavlan är dold
bindGestures(dom.digitalWrap, {
  onTap: handleClockTap,
  onSwipeLeft: () => cycleStyle(DIGITAL_STYLES, "digitalStyleId", 1),
  onSwipeRight: () => cycleStyle(DIGITAL_STYLES, "digitalStyleId", -1)
});


/* ==========================================================================
   13. OVERLAY-HANTERING (delad)
   ========================================================================== */

let elementFocusedBeforeOverlay = null;

function openOverlay(overlayElement) {
  elementFocusedBeforeOverlay = document.activeElement;
  overlayElement.classList.remove(CLASS_HIDDEN);
  overlayElement.querySelector("button, input, select")?.focus();
}

function closeOverlay(overlayElement) {
  overlayElement.classList.add(CLASS_HIDDEN);
  if (elementFocusedBeforeOverlay instanceof HTMLElement) elementFocusedBeforeOverlay.focus();
  elementFocusedBeforeOverlay = null;
}

document.addEventListener("keydown", (event) => {
  if (event.key !== "Escape") return;
  const openOverlayElement = document.querySelector(`.overlay:not(.${CLASS_HIDDEN})`);
  if (openOverlayElement !== null) closeOverlay(openOverlayElement);
});

// Klick på bakgrunden stänger — men inte klick inne i panelen
document.querySelectorAll(".overlay").forEach((overlayElement) => {
  overlayElement.addEventListener("click", (event) => {
    if (event.target === overlayElement) closeOverlay(overlayElement);
  });
});
