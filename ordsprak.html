<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ett visdomsord</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(circle at 50% 20%, #1e293b, #0f172a 70%);
    color: #f8fafc;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vmin 5vw;
  }
  #card {
    max-width: 560px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4vmin;
  }
  #quote {
    font-size: clamp(1.4rem, 5vmin, 2.2rem);
    font-weight: 700;
    line-height: 1.4;
  }
  #quote::before { content: "\201D"; }
  #quote::after { content: "\201D"; }
  button {
    background: #f97316;
    color: #111827;
    border: none;
    font-weight: 700;
    padding: 12px 26px;
    border-radius: 999px;
    font-size: 1rem;
    cursor: pointer;
  }
  #hint { font-size: 0.85rem; color: #94a3b8; }
</style>
</head>
<body>
<div id="card">
  <div id="quote"></div>
  <button id="new-btn">Nytt ord</button>
  <div id="hint">Svenska ordspråk och talesätt</div>
</div>

<script>
/* Traditionella svenska ordspråk (folkligt kulturarv, ingen enskild
   upphovsperson) — en förhållandevis stor lista så att samma inte dyker
   upp direkt igen. */
const sayings = [
  "Alla goda ting är tre.",
  "Alla vägar bär till Rom.",
  "Allt är inte guld som glimmar.",
  "Anfall är bästa försvar.",
  "Av skadan blir man vis.",
  "Bättre en fågel i handen än tio i skogen.",
  "Bättre fly än illa fäkta.",
  "Bättre sent än aldrig.",
  "Borta bra men hemma bäst.",
  "Bra karl reder sig själv.",
  "Bränt barn skyr elden.",
  "Det är ingen ko på isen.",
  "Det som göms i snö kommer fram i tö.",
  "Den som gapar efter mycket mister ofta hela stycket.",
  "Den som väntar på något gott väntar aldrig för länge.",
  "Ett gott skratt förlänger livet.",
  "Övning ger färdighet.",
  "Ingen rök utan eld.",
  "Man ska inte döma hunden efter håren.",
  "Man ska inte gräva en grop åt andra.",
  "Man ska smida medan järnet är varmt.",
  "Man vet vad man har, inte vad man får.",
  "Morgonstund har guld i mun.",
  "När katten är borta dansar råttorna på bordet.",
  "När man talar om trollen står de i farstun.",
  "Nöden är uppfinningarnas moder.",
  "Skomakare, bliv vid din läst.",
  "Skrattar bäst som skrattar sist.",
  "Tala är silver, tiga är guld.",
  "Tiden läker alla sår.",
  "Var dag har nog av sin egen plåga.",
  "Vad man sår får man skörda.",
  "Alla katter är grå i mörkret.",
  "Bättre att förekomma än förekommas.",
  "Bättre att stämma i bäcken än i ån.",
  "Den som spar han har.",
  "Först till kvarn får först mala.",
  "Man ska ta seden dit man kommer.",
  "Många bäckar små gör en stor å.",
  "Sent skall syndaren vakna.",
  "Skam den som ger sig.",
  "Var sak har sin tid.",
  "Allt har en ände, utom korven som har två.",
  "Arga katter får rivet skinn.",
  "Av barn och dårar får man höra sanningen.",
  "Att skiljas är att dö en smula.",
  "Bit inte den hand som föder dig.",
  "Blod är tjockare än vatten.",
  "Bättre brödlös än rådlös.",
  "Bättre ensam än i dåligt sällskap.",
  "Bättre ett ärligt nej än ett falskt ja."
];

let lastIndex = -1;
try {
  const saved = sessionStorage.getItem("ordsprak-last");
  if (saved !== null) lastIndex = Number(saved);
} catch (e) { /* sessionStorage kan vara otillgängligt, ignorera */ }

function pickSaying() {
  let idx;
  do {
    idx = Math.floor(Math.random() * sayings.length);
  } while (idx === lastIndex && sayings.length > 1);
  lastIndex = idx;
  try { sessionStorage.setItem("ordsprak-last", String(idx)); } catch (e) {}
  return sayings[idx];
}

function showNewSaying() {
  document.getElementById("quote").textContent = pickSaying();
}
document.getElementById("new-btn").addEventListener("click", showNewSaying);
showNewSaying();
</script>
</body>
</html>
