<!DOCTYPE html>
<html lang="sv" data-theme="funkis">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ett ordspråk</title>
<meta name="description" content="Ett slumpat svenskt ordspråk från Klockan." />
<meta name="theme-color" content="#2E181B" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Poiret+One&family=Oswald:wght@300;400;500&display=swap" rel="stylesheet" />

<style>
  /* ==========================================================================
     Paletterna är desamma som i Klockan.html, men bara de tokens den här sidan
     faktiskt använder. Ändras en färg i klockan måste den ändras här också —
     filerna delar ingen stilmall.
     ========================================================================== */
  :root {
    --proverb-fade-duration: 420ms;
    --content-max-width: 34rem;
    --radius-pill: 999px;
  }

  :root[data-theme="funkis"] {
    --background-color: #2E181B;
    --foreground-color: #EFE2CE;
    --accent-color: #C9A227;
    --muted-color: #A98A5B;
    --interface-font: 'Jost', system-ui, sans-serif;
    --proverb-letter-spacing: 0.01em;
  }
  :root[data-theme="deco"] {
    --background-color: #0B0B0D;
    --foreground-color: #EFE6D2;
    --accent-color: #D4AF6A;
    --muted-color: #8C7745;
    --interface-font: 'Poiret One', 'Jost', sans-serif;
    --proverb-letter-spacing: 0.05em;
  }
  :root[data-theme="station"] {
    --background-color: #F2F0EB;
    --foreground-color: #16181A;
    --accent-color: #D3312A;
    --muted-color: #6B7075;
    --interface-font: 'Jost', system-ui, sans-serif;
    --proverb-letter-spacing: 0;
  }
  :root[data-theme="bakelit"] {
    --background-color: #1A1310;
    --foreground-color: #FFB454;
    --accent-color: #FF8A2B;
    --muted-color: #A9743A;
    --interface-font: 'Oswald', system-ui, sans-serif;
    --proverb-letter-spacing: 0.03em;
  }
  :root[data-theme="neon"] {
    --background-color: #08070E;
    --foreground-color: #39E5FF;
    --accent-color: #FF3DCB;
    --muted-color: #4E8FA3;
    --interface-font: 'Jost', system-ui, sans-serif;
    --proverb-letter-spacing: 0.04em;
  }
  :root[data-theme="minimal"] {
    --background-color: #101112;
    --foreground-color: #E8E8E6;
    --accent-color: #E8E8E6;
    --muted-color: #7C7F83;
    --interface-font: 'Jost', system-ui, sans-serif;
    --proverb-letter-spacing: 0.06em;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--background-color);
    color: var(--foreground-color);
    font-family: var(--interface-font);
  }

  #page {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.4rem;
    /* Marginalerna respekterar hål och rundade hörn på telefonskärmar */
    padding: max(2rem, env(safe-area-inset-top)) 1.6rem max(2rem, env(safe-area-inset-bottom));
    text-align: center;
  }

  /* Liten urtavla som knyter sidan till klockan man just skannat */
  #dial-mark { width: 3rem; height: 3rem; flex-shrink: 0; }
  #dial-mark .rim, #dial-mark .tick { stroke: var(--accent-color); fill: none; }
  #dial-mark .hand { stroke: var(--foreground-color); stroke-linecap: round; }
  #dial-mark .hub { fill: var(--accent-color); }

  #proverb-figure {
    margin: 0;
    max-width: var(--content-max-width);
    display: flex;
    flex-direction: column;
    gap: 1.6rem;
    animation: proverb-appear var(--proverb-fade-duration) ease-out both;
  }
  @keyframes proverb-appear {
    from { opacity: 0; transform: translateY(0.7rem); }
    to { opacity: 1; transform: none; }
  }

  #proverb-text {
    margin: 0;
    font-size: clamp(1.35rem, 5.6vw, 2.1rem);
    font-style: italic;
    line-height: 1.45;
    letter-spacing: var(--proverb-letter-spacing);
    text-wrap: balance;
  }

  #proverb-source {
    font-size: clamp(0.95rem, 3.4vw, 1.15rem);
    color: var(--muted-color);
    font-style: normal;
  }
  /* Tunn linje ovanför upphovspersonen, samma gest som mässingsdetaljerna */
  #proverb-source::before {
    content: "";
    display: block;
    width: 2.5rem;
    height: 1px;
    margin: 0 auto 1.1rem;
    background: var(--accent-color);
    opacity: 0.6;
  }

  #next-proverb-button {
    background: none;
    border: 1px solid var(--accent-color);
    color: var(--foreground-color);
    font-family: var(--interface-font);
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    /* Minst 44 px höjd — annars blir knappen svår att träffa med tummen */
    padding: 0.95rem 1.9rem;
    min-height: 44px;
    border-radius: var(--radius-pill);
    cursor: pointer;
  }
  #next-proverb-button:active { background: var(--accent-color); color: var(--background-color); }
  #next-proverb-button:focus-visible { outline: 2px solid var(--accent-color); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    #proverb-figure { animation: none; }
  }
</style>
</head>
<body>
<noscript>
  <p style="padding:2rem;text-align:center;">Sidan kräver JavaScript för att slumpa fram ett visdomsord.</p>
</noscript>

<main id="page">
  <svg id="dial-mark" viewBox="0 0 100 100" role="img" aria-label="Klockan">
    <circle class="rim" cx="50" cy="50" r="44" stroke-width="3" />
    <line class="tick" x1="50" y1="10" x2="50" y2="20" stroke-width="4" />
    <line class="tick" x1="90" y1="50" x2="80" y2="50" stroke-width="4" />
    <line class="tick" x1="50" y1="90" x2="50" y2="80" stroke-width="4" />
    <line class="tick" x1="10" y1="50" x2="20" y2="50" stroke-width="4" />
    <line class="hand" x1="50" y1="50" x2="35" y2="38" stroke-width="5" />
    <line class="hand" x1="50" y1="50" x2="72" y2="40" stroke-width="3.5" />
    <circle class="hub" cx="50" cy="50" r="4" />
  </svg>

  <figure id="proverb-figure">
    <blockquote id="proverb-text"></blockquote>
    <figcaption id="proverb-source"></figcaption>
  </figure>

  <button id="next-proverb-button" type="button">Nytt ordspråk</button>
</main>

<script type="module">
"use strict";

/* ==========================================================================
   1. KONSTANTER OCH DATA
   ========================================================================== */

const THEME_QUERY_PARAMETER = "tema";
const THEME_ATTRIBUTE = "data-theme";
const DEFAULT_THEME_ID = "funkis";
const THEME_IDS = Object.freeze(["funkis", "deco", "station", "bakelit", "neon", "minimal"]);

const LAST_PROVERB_STORAGE_KEY = "klocka-senaste-ordsprak";
const NO_PREVIOUS_PROVERB_INDEX = -1;
const PROVERBS_UNAVAILABLE_MESSAGE = "Ordspråken kunde inte hämtas just nu.";

const OPENING_QUOTATION_MARK = "\u201D";
const CLOSING_QUOTATION_MARK = "\u201D";
const PROVERB_SOURCE_LABEL = "Svenskt ordspråk";

const TEXTS_MODULE_PATH = "./quotes.js";


/* ==========================================================================
   2. DOM-REFERENSER
   ========================================================================== */

function requireElement(elementId) {
  const element = document.getElementById(elementId);
  // Fail fast: saknad nod betyder att HTML och JS glidit isär vid en ändring
  if (element === null) throw new Error(`Saknar element med id "${elementId}"`);
  return element;
}

const dom = Object.freeze({
  figure: requireElement("proverb-figure"),
  text: requireElement("proverb-text"),
  source: requireElement("proverb-source"),
  nextButton: requireElement("next-proverb-button"),
  themeColorMeta: document.querySelector('meta[name="theme-color"]')
});


/* ==========================================================================
   3. TEMA
   ========================================================================== */

/* Klockan kan skicka med sitt tema i adressen så att sidan känns som en
   fortsättning på skärmen man just skannat. Saknas eller är värdet okänt
   används standardtemat. */
function readThemeFromQuery() {
  // URLSearchParams tar en ren sträng och behöver ingen basadress att utgå från
  const requestedTheme = new URLSearchParams(window.location.search).get(THEME_QUERY_PARAMETER);
  return THEME_IDS.includes(requestedTheme) ? requestedTheme : DEFAULT_THEME_ID;
}

function applyTheme(themeId) {
  document.documentElement.setAttribute(THEME_ATTRIBUTE, themeId);
  if (dom.themeColorMeta === null) return;

  const backgroundColor = getComputedStyle(document.documentElement)
    .getPropertyValue("--background-color").trim();
  if (backgroundColor) dom.themeColorMeta.setAttribute("content", backgroundColor);
}


/* ==========================================================================
   4. VAL AV ORDSPRÅK
   ========================================================================== */

/* Ordspråken bor i quotes.js. Den filen har två skilda samlingar: påskägget i
   index.html använder QUOTES, den här sidan PROVERBS. De ska inte överlappa. */
let proverbs = [];

async function loadProverbs() {
  const textsModule = await import(TEXTS_MODULE_PATH);
  proverbs = textsModule.PROVERBS;
}

function readLastProverbIndex() {
  try {
    const storedValue = Number(window.localStorage.getItem(LAST_PROVERB_STORAGE_KEY));
    const isUsable = Number.isInteger(storedValue) && storedValue >= 0 && storedValue < proverbs.length;
    return isUsable ? storedValue : NO_PREVIOUS_PROVERB_INDEX;
  } catch (error) {
    /* Lagring kan vara avstängd, till exempel i privat läge. Då upprepas ett
       ordspråk ibland, men sidan fungerar precis som vanligt. */
    return NO_PREVIOUS_PROVERB_INDEX;
  }
}

function writeLastProverbIndex(proverbIndex) {
  try {
    window.localStorage.setItem(LAST_PROVERB_STORAGE_KEY, String(proverbIndex));
  } catch (error) {
    // Se kommentaren i readLastProverbIndex — misslyckad lagring är ofarlig
  }
}

/* Drar ett nytt ordspråk och undviker det som visades sist, så att två skanningar
   i rad inte ger samma text. */
function pickProverbIndex(previousIndex) {
  if (proverbs.length < 2) return 0;

  let nextIndex = previousIndex;
  while (nextIndex === previousIndex) {
    nextIndex = Math.floor(Math.random() * proverbs.length);
  }
  return nextIndex;
}


/* ==========================================================================
   5. VISNING
   ========================================================================== */

function showProverb(proverbIndex) {
  const proverb = proverbs[proverbIndex];
  dom.text.textContent = `${OPENING_QUOTATION_MARK}${proverb}${CLOSING_QUOTATION_MARK}`;
  dom.source.textContent = PROVERB_SOURCE_LABEL;

  // Layouten måste läsas om, annars startar inte animationen om vid nytt ordspråk
  dom.figure.style.animation = "none";
  void dom.figure.offsetWidth;
  dom.figure.style.animation = "";
}

let currentProverbIndex = NO_PREVIOUS_PROVERB_INDEX;

function drawNewProverb() {
  currentProverbIndex = pickProverbIndex(currentProverbIndex);
  writeLastProverbIndex(currentProverbIndex);
  showProverb(currentProverbIndex);
}

dom.nextButton.addEventListener("click", drawNewProverb);


/* ==========================================================================
   6. START
   ========================================================================== */

/* Startas som en vanlig async-funktion i stället för med await direkt i
   modulen. Det håller igång även på äldre webbläsare och gör steget testbart. */
async function loadAndShowFirstProverb() {
  try {
    await loadProverbs();
    currentProverbIndex = readLastProverbIndex();
    drawNewProverb();
  } catch (error) {
    console.warn("Ordspråken kunde inte laddas:", error);
    dom.text.textContent = PROVERBS_UNAVAILABLE_MESSAGE;
    dom.source.textContent = "";
    dom.nextButton.hidden = true;
  }
}

applyTheme(readThemeFromQuery());
loadAndShowFirstProverb();
</script>
</body>
</html>
